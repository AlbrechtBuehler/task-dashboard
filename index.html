document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content\">\n<script src=\"4bfb6a6b-d30d-4991-a8ef-4131ba38538b\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"design_doc_mode\" content=\"canvas\">\n<style>\n  :root{\n    /* --- Farbschema \u00abGrau\u00bb (03.08.2026, Satz \u00abkr\u00e4ftiger\u00bb) ------------------------------------\n       Grundlage: das Merkblatt aus MOPP. Erweitert um die Zwischenstufen, die\n       PEPAPP braucht: sieben Textstufen statt drei, vier Kartenstufen statt\n       einer, weil hier Karten in Karten liegen. Rollenfarben stehen bewusst\n       NICHT hier - sie sind Daten (data.roles), keine Darstellung.        */\n\n    /* Grund */\n    --bg:#202427;            /* Seitengrund */\n    --bg-glow:#282D31;       /* Lichtpunkt oben links */\n\n    /* Karten - je ein Verlauf von oben nach unten, aussen nach innen heller */\n    --card-a1:#333A3F; --card-a2:#2B3135;   /* Standardkarte */\n    --card-b1:#2F3539; --card-b2:#282D31;   /* Karte in der Karte */\n    --card-c1:#313739; --card-c2:#282D32;   /* Modal, grosse Flaeche */\n    --card-d1:#3A4045; --card-d2:#2E3438;   /* schwebendes Menue */\n    --surface2:#262A2E;      /* flach: Segmentleiste, Eingabefeld */\n    --surface-ring:#202427;  /* Trennring um eine Farbprobe */\n\n    /* Schrift, hell nach dunkel */\n    --ink:#E7EAEC;           /* Haupttext */\n    --ink2:#DCE1E3;          /* Text in Karten */\n    --ink3:#D5DBDD;          /* Kartentitel */\n    --muted:#C3CBCF;         /* Chips, Knopftexte */\n    --muted2:#B2BABE;        /* Nebentext */\n    --faint:#9AA2A7;         /* Zahlen, Zaehler */\n    --faint2:#8A9297;        /* Etiketten, Grossbuchstaben */\n    --dim:#767E83;           /* inaktives Symbol, Griff */\n    --dim2:#5E666B;          /* aus, tot */\n\n    /* Akzent - hell, nicht farbig. Schrift darauf IMMER --accent-fg */\n    --accent1:#DDE4E7; --accent2:#C3CBCF;   /* Verlauf des Hauptknopfs */\n    --accent-fg:#202427;                    /* Schrift auf dem Akzent */\n\n    /* Zustand - Ampel, gedaempft */\n    --good:#74A98C;\n    --warn:#C9A87C;\n    --high:#CA8676; --high-h:#DDA093;\n    --low:#7C9EC0;  --drop:rgba(124,158,192,.9);  --low-h:#9DB8D3; --low-mid:rgba(124,158,192,.5);\n    --low-bg:rgba(124,158,192,.12);\n    --low-line:rgba(124,158,192,.24);\n    --low-sel:rgba(124,158,192,.30);\n    --info:#8FBFB4; --info-bg:rgba(143,191,180,.14);\n  }\n  body { margin:0; background:var(--accent-fg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable Text','Segoe UI',Helvetica,Arial,sans-serif; }\n  * { font-family:inherit; }\n  a { color:var(--low); text-decoration:none; }\n  a:hover { color:var(--low-h); }\n  ::selection { background:var(--low-sel); }\n  ::-webkit-scrollbar { width:10px; height:10px; }\n  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.12); border-radius:8px; border:3px solid transparent; background-clip:content-box; }\n  input, textarea, select, button { font-family:inherit; }\n  /* Native Auswahl- und Datumsfelder folgen dem dunklen Grund, sonst weiss auf weiss */\n  html, body, input, textarea, select, option { color-scheme: dark; }\n  select option { background:var(--surface2); color:var(--ink); }\n  input[type=\"date\"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity:.45; cursor:pointer; }\n  input[type=\"date\"]::-webkit-calendar-picker-indicator:hover { opacity:.85; }\n\n  /* Mobile Navigation (29.07.2026) - Bodenleiste statt Seitenleiste unter 760px Breite.\n     Grund fuer Klassen statt reiner Inline-Style-Anpassung: Inline style=\"\" laesst sich\n     ohne !important nicht per @media ueberschreiben. Die Werte selbst (Farben, Klick-\n     Handler) kommen weiterhin aus derselben Stelle in JS wie die Desktop-Seitenleiste -\n     hier nur Sichtbarkeit und Anordnung. Mockup vom 29.07. bestaetigt. */\n  .pep-mobile-chrome, .pep-fab, .pep-tabbar, .pep-pager { display:none; }\n  @media (max-width: 760px) {\n    .pep-shell { padding:20px 16px 84px !important; }\n    .pep-grid { display:block !important; }\n    .pep-sidebar { display:none !important; }\n    .pep-primary-btn { display:none !important; }\n    .pep-viewtitle { font-size:25px !important; }\n    .pep-mobile-chrome { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }\n    .pep-fab { display:flex; }\n    .pep-tabbar { display:flex; }\n\n    /* Board im Hochformat (29.07.2026): das feste 4er-Raster quetschte die Karte auf\n       61px - Punkt und Status-Chip sind flex:none, dem Titel blieb NULL Pixel, kein\n       Aufgabentitel war lesbar. Statt zu schrumpfen wird hier gewischt: eine Spalte\n       fuellt 82% der Breite, die naechste lugt hervor, Scroll-Snap rastet ein.\n       display:flex !important ueberschreibt das inline gesetzte display:grid -\n       gap und align-items aus boardGridStyle gelten bei flex unveraendert weiter.\n       Oberhalb 760px greift nichts davon: Desktop bleibt unangetastet, kein Balken. */\n    .pep-board {\n      display:flex !important;\n      overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;\n      margin:0 -16px !important; padding:0 16px 2px !important; scroll-padding-left:16px;\n      overscroll-behavior-x:contain;\n    }\n    .pep-board::-webkit-scrollbar { display:none; }\n    .pep-board > * { flex:0 0 82%; scroll-snap-align:start; }\n    .pep-pager { display:flex; }\n  }\n  /* Wischposition-Anzeige - nur mobil sichtbar, bei einer einzigen Spalte gar nicht */\n  .pep-pager { gap:5px; justify-content:center; margin-top:14px; }\n  .pep-pager:empty { display:none !important; margin:0; }\n  .pep-pager span { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.18); transition:width .18s, background .18s; }\n  .pep-pager span.on { width:16px; border-radius:3px; background:rgba(255,255,255,.55); }\n  /* Umschalter Business / Privat / Beide (31.07.2026). Eine Klasse fuer beide\n     Orte; die Innenabstaende unterscheiden sich nur ueber den Elternteil. */\n  .pep-ctxseg {\n    display:flex; gap:2px; padding:3px; border-radius:10px; margin:0 6px;\n    background:rgba(255,255,255,.045); box-shadow:inset 0 0 0 .5px rgba(255,255,255,.075);\n  }\n  .pep-mobile-chrome .pep-ctxseg { margin:12px 0 0; }\n  .pep-microbar { display:flex; align-items:center; justify-content:space-between; gap:8px; }\n  .pep-microbar .brand { font-size:11px; font-weight:590; letter-spacing:.06em; text-transform:uppercase; color:var(--faint2); }\n  .pep-microbar .actions { display:flex; gap:6px; }\n  .pep-pillbtn {\n    font-size:11.5px; color:var(--muted2); background:rgba(255,255,255,.05); box-shadow:inset 0 0 0 .5px rgba(255,255,255,.07);\n    border-radius:8px; padding:6px 9px; cursor:pointer; transition:.14s; white-space:nowrap;\n  }\n  .pep-rolescroll { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:0 16px; }\n  .pep-rolescroll::-webkit-scrollbar { display:none; }\n  .pep-fab {\n    position:fixed; right:18px; bottom:calc(78px + env(safe-area-inset-bottom));\n    width:52px; height:52px; border-radius:50%; align-items:center; justify-content:center;\n    background:linear-gradient(var(--accent1),var(--accent2)); color:var(--accent-fg); font-size:24px; font-weight:500;\n    box-shadow:0 10px 26px -6px rgba(0,0,0,.6); cursor:pointer; transition:.14s; z-index:50;\n  }\n  .pep-fab:active { transform:scale(.94); }\n  .pep-tabbar {\n    position:fixed; left:0; right:0; bottom:0; z-index:50;\n    padding:8px 6px calc(8px + env(safe-area-inset-bottom));\n    background:linear-gradient(var(--card-b2),var(--card-c2));\n    box-shadow:inset 0 .5px 0 rgba(255,255,255,.08), 0 -10px 30px -12px rgba(0,0,0,.7);\n  }\n  /* Aufgaben-Modal (Dreispalter): unter 1250px stapeln die drei Spalten,\n     die Arbeit bleibt oben. Wie ueberall rein additiv per @media, damit die\n     Desktop-Regel nicht angefasst wird. */\n  @media (max-width: 1250px) {\n    .pep-tsheet { grid-template-columns: minmax(0,1fr) !important; max-width: 820px !important; }\n    .pep-tmain { order: -1 !important; }\n    .pep-tside { flex-direction: row !important; flex-wrap: wrap !important; min-width: 0; }\n    .pep-tside > div { flex: 1 1 240px; min-width: 0; }\n  }\n  @media (max-width: 760px) {\n    .pep-tsheet { padding-bottom: 90px; }\n    .pep-tside { flex-direction: column !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"pep-shell\" style=\"min-height:100vh;background:radial-gradient(120% 80% at 20% -10%, var(--bg-glow) 0%, var(--bg) 58%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:44px 32px 120px\">\n  <div class=\"pep-grid\" style=\"width:100%;max-width:1440px;display:grid;grid-template-columns:216px 1fr;gap:36px;align-items:start\">\n\n    <div class=\"pep-mobile-chrome\">\n      <div class=\"pep-microbar\">\n        <span class=\"brand\">PEPAPP<\u002Fspan>\n        <div class=\"actions\">\n          <span sc-camel-on-click=\"{{ openSearch }}\" class=\"pep-pillbtn\">Suchen<\u002Fspan>\n          <span sc-camel-on-click=\"{{ openPeople }}\" class=\"pep-pillbtn\">Personen<\u002Fspan>\n          <span sc-camel-on-click=\"{{ openRoles }}\" class=\"pep-pillbtn\">Rollen<\u002Fspan>\n          <span sc-camel-on-click=\"{{ openCategories }}\" class=\"pep-pillbtn\">Kategorien<\u002Fspan>\n          <span sc-camel-on-click=\"{{ openData }}\" class=\"pep-pillbtn\">Daten<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pep-ctxseg\">\n        <sc-for list=\"{{ ctxOptions }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <span sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"pep-rolescroll\">\n        <sc-for list=\"{{ roleFilters }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div sc-camel-on-click=\"{{ r.onClick }}\" style=\"{{ r.chipStyle }}\">\n            <span style=\"{{ r.dotStyle }}\"><\u002Fspan>\n            <span>{{ r.label }}<\u002Fspan>\n            <span style=\"{{ r.chipCountStyle }}\">{{ r.count }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"pep-sidebar\" style=\"position:sticky;top:44px;display:flex;flex-direction:column;gap:24px\">\n      <div style=\"display:flex;flex-direction:column;gap:3px;padding:0 12px\">\n        <span style=\"font-size:15px;font-weight:600;letter-spacing:-.01em\">PEPAPP<\u002Fspan>\n        <span style=\"font-size:12.5px;color:var(--faint);letter-spacing:-.005em\">{{ headDate }}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"pep-ctxseg\">\n        <sc-for list=\"{{ ctxOptions }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <span sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:2px\">\n        <sc-for list=\"{{ areas }}\" as=\"a\" hint-placeholder-count=\"6\">\n          <div sc-camel-on-click=\"{{ a.onClick }}\" style=\"{{ a.style }}\" style-hover=\"background:rgba(255,255,255,.05)\">\n            <span>{{ a.label }}<\u002Fspan>\n            <span style=\"{{ a.countStyle }}\">{{ a.count }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"height:1px;background:linear-gradient(to right,rgba(255,255,255,.09),rgba(255,255,255,0));margin:0 12px\"><\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:2px\">\n        <div style=\"font-size:11px;font-weight:590;letter-spacing:.06em;text-transform:uppercase;color:var(--faint2);padding:0 12px 8px\">{{ roleFilterTitle }}<\u002Fdiv>\n        <sc-for list=\"{{ roleFilters }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div sc-camel-on-click=\"{{ r.onClick }}\" style=\"{{ r.style }}\" style-hover=\"background:rgba(255,255,255,.05)\">\n            <span style=\"display:flex;align-items:center;gap:10px\">\n              <span style=\"{{ r.dotStyle }}\"><\u002Fspan>\n              <span>{{ r.label }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"{{ r.countStyle }}\">{{ r.count }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"height:1px;background:linear-gradient(to right,rgba(255,255,255,.09),rgba(255,255,255,0));margin:0 12px\"><\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:2px;padding-bottom:8px\">\n        <div sc-camel-on-click=\"{{ openSearch }}\" style=\"display:flex;align-items:center;justify-content:space-between;font-size:13px;letter-spacing:-.008em;color:var(--muted2);padding:7px 12px;border-radius:8px;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.05);color:var(--ink)\">\n          <span>Suchen<\u002Fspan><span style=\"font-size:11.5px;color:var(--faint2);letter-spacing:.02em\">\u2318K<\u002Fspan>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ openPeople }}\" style=\"display:flex;align-items:center;justify-content:space-between;font-size:13px;letter-spacing:-.008em;color:var(--muted2);padding:7px 12px;border-radius:8px;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.05);color:var(--ink)\">\n          <span>Personen<\u002Fspan><span style=\"font-size:12px;color:var(--faint2);font-variant-numeric:tabular-nums\">{{ peopleCount }}<\u002Fspan>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ openRoles }}\" style=\"display:flex;align-items:center;justify-content:space-between;font-size:13px;letter-spacing:-.008em;color:var(--muted2);padding:7px 12px;border-radius:8px;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.05);color:var(--ink)\">\ izing:border-box;background:rgba(255,255,255,.045);border:none;border-radius:9px;padding:9px 11px;font-size:13.5px;color:var(--ink);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08);outline:none\" value=\"\" sc-camel-on-change=\"{{ m.addDep }}\">\n          <sc-for list=\"{{ m.depOpts }}\" as=\"o\" hint-placeholder-count=\"3\">\n            <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n\n      <div style=\"{{ m.targetWrapStyle }}\">\n        <label style=\"font-size:11px;font-weight:590;letter-spacing:.06em;text-transform:uppercase;color:var(--faint2)\">{{ m.targetLabel }}<\u002Flabel>\n        <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n          <sc-for list=\"{{ m.targetOpts }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <span sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <span style=\"font-size:11.5px;color:var(--faint2)\">{{ m.targetHint }}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"{{ m.colorWrapStyle }}\">\n        <label style=\"font-size:11px;font-weight:590;letter-spacing:.06em;text-transform:uppercase;color:var(--faint2)\">Farbe<\u002Flabel>\n        <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n          <sc-for list=\"{{ m.colorOpts }}\" as=\"c\" hint-placeholder-count=\"10\">\n            <span sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\"><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"{{ m.listWrapStyle }}\">\n        <label style=\"{{ m.listLabelStyle }}\">{{ m.listLabel }}<\u002Flabel>\n        <sc-for list=\"{{ m.listRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div draggable=\"{{ r.draggable }}\" sc-camel-on-drag-start=\"{{ r.onDragStart }}\" sc-camel-on-drag-end=\"{{ r.onDragEnd }}\" sc-camel-on-drag-over=\"{{ r.onDragOver }}\" sc-camel-on-drag-leave=\"{{ r.onDragLeave }}\" sc-camel-on-drop=\"{{ r.onDrop }}\" sc-camel-on-click=\"{{ r.onClick }}\" style=\"{{ r.rowStyle }}\" style-hover=\"background:rgba(255,255,255,.05)\">\n            <span style=\"{{ r.dotStyle }}\"><\u002Fspan>\n            <span style=\"flex:1;min-width:0;font-size:13.5px;letter-spacing:-.008em;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.title }}<\u002Fspan>\n            <span style=\"{{ r.badgeStyle }}\">{{ r.badge }}<\u002Fspan>\n            <span style=\"{{ r.dateStyle }}\">{{ r.date }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"{{ m.noListStyle }}\">{{ m.emptyList }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:10px;padding:14px 22px;box-shadow:inset 0 .5px 0 rgba(255,255,255,.07)\">\n      <span sc-camel-on-click=\"{{ m.onDelete }}\" style=\"{{ m.deleteStyle }}\" style-hover=\"color:var(--high-h)\">L\u00f6schen<\u002Fspan>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <span sc-camel-on-click=\"{{ closeModal }}\" style=\"font-size:13px;letter-spacing:-.005em;color:var(--muted2);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.07);border-radius:9px;padding:8px 14px;cursor:pointer\" style-hover=\"color:var(--ink)\">{{ m.cancelLabel }}<\u002Fspan>\n      <span sc-camel-on-click=\"{{ m.onSaveKeepOpen }}\" style=\"{{ m.saveKeepOpenStyle }}\" style-hover=\"background:rgba(255,255,255,.09)\">Speichern & weiter<\u002Fspan>\n      <span sc-camel-on-click=\"{{ m.onSave }}\" style=\"{{ m.saveStyle }}\" style-hover=\"filter:brightness(1.06)\">Speichern<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div sc-camel-on-click=\"{{ closeSearch }}\" style=\"{{ searchOverlayStyle }}\">\n  <div sc-camel-on-click=\"{{ stopEvt }}\" style=\"width:100%;max-width:560px;display:flex;flex-direction:column;border-radius:16px;background:linear-gradient(var(--card-c1),var(--card-c2));box-shadow:inset 0 .5px 0 rgba(255,255,255,.08),inset 0 0 0 .5px rgba(255,255,255,.06),0 40px 90px -20px rgba(0,0,0,.9);overflow:hidden\">\n    <input autofocus=\"\" style=\"width:100%;box-sizing:border-box;background:transparent;border:none;padding:18px 20px;font-size:16px;letter-spacing:-.012em;color:var(--ink);outline:none\" type=\"search\" placeholder=\"Aufgabe, Notiz oder Projekt suchen \u2026\" value=\"{{ query }}\" sc-camel-on-change=\"{{ setQuery }}\">\n    <div style=\"max-height:60vh;overflow:auto;box-shadow:inset 0 .5px 0 rgba(255,255,255,.07)\">\n      <sc-for list=\"{{ results }}\" as=\"r\" hint-placeholder-count=\"0\">\n        <div sc-camel-on-click=\"{{ r.onClick }}\" style=\"display:flex;align-items:center;gap:11px;padding:12px 20px;cursor:pointer;box-shadow:inset 0 .5px 0 rgba(255,255,255,.045)\" style-hover=\"background:rgba(255,255,255,.05)\">\n          <span style=\"{{ r.dotStyle }}\"><\u002Fspan>\n          <span style=\"flex:1;min-width:0;font-size:13.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.title }}<\u002Fspan>\n          <span style=\"flex:none;font-size:11.5px;color:var(--faint2)\">{{ r.kind }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"{{ noResultsStyle }}\">{{ noResultsText }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div sc-camel-on-click=\"{{ closeStatusMenu }}\" style=\"{{ statusMenuBackdropStyle }}\"><\u002Fdiv>\n<div style=\"{{ statusMenuStyle }}\">\n  <sc-for list=\"{{ statusMenuItems }}\" as=\"si\" hint-placeholder-count=\"5\">\n    <div sc-camel-on-click=\"{{ si.onClick }}\" style=\"{{ si.style }}\" style-hover=\"background:rgba(255,255,255,.06)\">\n      <span>{{ si.label }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n\n<div sc-camel-on-click=\"{{ closeRecur }}\" style=\"{{ recurBackdropStyle }}\"><\u002Fdiv>\n<div sc-camel-on-click=\"{{ stopEvt }}\" style=\"{{ recurPanelStyle }}\">\n  <h3 style=\"margin:0 0 14px;font-size:14.5px;font-weight:600;letter-spacing:-.01em\">Wiederholung<\u002Fh3>\n  <div style=\"display:flex;gap:8px;margin-bottom:10px\">\n    <input style=\"width:56px;flex:none;text-align:center;font-variant-numeric:tabular-nums;box-sizing:border-box;background:rgba(255,255,255,.045);border:none;border-radius:9px;padding:9px 11px;font-size:13.5px;color:var(--ink);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08);outline:none\" type=\"number\" min=\"1\" value=\"{{ recurN }}\" sc-camel-on-change=\"{{ setRecurN }}\">\n    <sc-raw-select style=\"flex:1;min-width:0;box-sizing:border-box;background:rgba(255,255,255,.045);border:none;border-radius:9px;padding:9px 11px;font-size:13.5px;color:var(--ink);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08);outline:none;cursor:pointer\" value=\"{{ recurUnit }}\" sc-camel-on-change=\"{{ setRecurUnit }}\">\n      <sc-for list=\"{{ recurUnitOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n        <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n      <\u002Fsc-for>\n    <\u002Fsc-raw-select>\n  <\u002Fdiv>\n  <div style=\"{{ recurWeekdaySegStyle }}\">\n    <sc-for list=\"{{ recurWeekdayChips }}\" as=\"w\" hint-placeholder-count=\"7\">\n      <div sc-camel-on-click=\"{{ w.onClick }}\" style=\"{{ w.style }}\">{{ w.label }}<\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <span style=\"{{ recurHintStyle }}\">Mehrere Wochentage m\u00f6glich. Ohne Auswahl: gleicher Wochentag wie das F\u00e4llig-Datum.<\u002Fspan>\n  <div style=\"font-size:12px;color:var(--low);background:var(--low-bg);border-radius:8px;padding:8px 10px;box-shadow:inset 0 0 0 .5px var(--low-line);margin-bottom:14px\">{{ recurPreview }}<\u002Fdiv>\n  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n    <span sc-camel-on-click=\"{{ clearRecur }}\" style=\"font-size:12.5px;font-weight:560;padding:8px 13px;border-radius:8px;cursor:pointer;color:var(--muted2)\" style-hover=\"color:var(--ink)\">Keine Wiederholung<\u002Fspan>\n    <span sc-camel-on-click=\"{{ closeRecur }}\" style=\"font-size:12.5px;font-weight:560;padding:8px 13px;border-radius:8px;cursor:pointer;color:var(--accent-fg);background:var(--ink)\" style-hover=\"filter:brightness(1.06)\">Fertig<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"pep-fab\" sc-camel-on-click=\"{{ primaryAction }}\">+<\u002Fdiv>\n<div class=\"pep-tabbar\">\n  <sc-for list=\"{{ areas }}\" as=\"a\" hint-placeholder-count=\"5\">\n    <div sc-camel-on-click=\"{{ a.onClick }}\" style=\"{{ a.tabStyle }}\">\n      <span style=\"font-size:11px;letter-spacing:-.003em\">{{ a.label }}<\u002Fspan>\n      <span style=\"{{ a.tabCountStyle }}\">{{ a.count }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showBadges&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Zeile&quot;},&quot;denseRows&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Zeile&quot;}}\">\n/* \u2500\u2500 Farbregel: Rot und Gr\u00fcn geh\u00f6ren dem Zustand. Rollen liegen ausserhalb. \u2500\u2500 */\n/* Rollen sind seit 31.07.2026 Daten statt Code: `let` statt `const`, sie reisen\n   durch alle Speicherpfade mit (persist / componentDidMount / applyLegacy /\n   from- und toLegacy) und lassen sich in der Verwaltung bearbeiten. Jeder\n   Eintrag traegt `ctx`: 'b' fuer die Geschaeftsrollen, 'p' fuer die privaten\n   Lebensbereiche. Getrennte Listen im Sinn der Bedienung, EIN Array im Sinn der\n   Speicherung - dadurch bleiben roleById() und die rund zwanzig Zeichenstellen\n   unveraendert. Reihenfolge = Array-Reihenfolge; bewusst KEIN ord-Feld wie bei\n   den Kategorien, denn die haben zwei gleichzeitige Sortierungen (alphabetisch\n   in der Verwaltung, frei im Board), Rollen nur eine. Das Array wird physisch\n   gruppiert gehalten: erst alle ctx:'b', dann alle ctx:'p'. */\nconst DEFAULT_ROLES = [\n  { id:'dc',   label:'DC',   color:'#FF9F0A', ctx:'b' },\n  { id:'dm',   label:'DM',   color:'#0A84FF', ctx:'b' },\n  { id:'qm',   label:'QM',   color:'#2FD4B8', ctx:'b' },\n  { id:'it',   label:'IT',   color:'#BF5AF2', ctx:'b' },\n  { id:'meta', label:'Meta', color:'#8E8E93', ctx:'b' }\n];\n/* Die privaten Lebensbereiche. Sie werden EINMALIG eingesaet, nicht bei jedem\n   Start - sonst kaemen geloeschte Eintraege beim naechsten Laden zurueck. Die\n   Marke dafuer ist das Feld `rolesSeeded` im Bestand (localStorage und\n   tasks.json). Wer vor dem 31.07.2026 gespeichert hat, hat sie nicht und\n   bekommt die Liste genau einmal dazu. */\nconst DEFAULT_PRIVATE_ROLES = [\n  { id:'lbmeta', label:'Meta',       color:'#5E5CE6', ctx:'p' },\n  { id:'lbges',  label:'Gesundheit', color:'#64D2FF', ctx:'p' },\n  { id:'lbfin',  label:'Finanzen',   color:'#B0C44A', ctx:'p' },\n  { id:'lbarb',  label:'Arbeit',     color:'#A2845E', ctx:'p' },\n  { id:'lbfrei', label:'Freizeit',   color:'#FF6482', ctx:'p' }\n];\nlet ROLES = [...DEFAULT_ROLES, ...DEFAULT_PRIVATE_ROLES].map(r => ({ ...r }));\n/* Eine eingelesene Rollenliste uebernehmen und dabei die Lebensbereiche\n   nachziehen, falls der Bestand noch aus der Zeit davor stammt. normalizeRoles\n   entfernt Doppelte anhand der ID, ein zweiter Durchlauf schadet also nicht. */\nconst adoptRoles = (list, seeded) => {\n  const nr = normalizeRoles(list);\n  if (!nr) return null;\n  return seeded ? nr : normalizeRoles([...nr, ...DEFAULT_PRIVATE_ROLES]);\n};\nconst RED = 'var(--high)', GREEN = 'var(--good)', MUTED = '#8b8e93';\n/* Rueckfall NICHT mehr ROLES[4]: sobald Rollen loeschbar sind und weniger als\n   fuenf uebrig bleiben, waere das undefined - der naechste .label/.color-Zugriff\n   im Render-Pfad wirft, und die Seite bleibt weiss. Ein festes Sentinel kann\n   nicht verschwinden. Bewusste Nebenwirkung: eine Aufgabe mit unbekannter Rolle\n   heisst jetzt \"Ohne Rolle\" statt \"Meta\" - kaputte Daten werden sichtbar statt\n   still auf Meta umgebogen. Farbe praktisch identisch (var(--muted2) gegen #8E8E93). */\nconst NO_ROLE = { id:'', label:'Ohne Rolle', color:MUTED, ctx:'b' };\nconst roleById = id => ROLES.find(r => r.id === id) || NO_ROLE;\n/* Rollen eines Kontexts. 'beide' liefert alle in Array-Reihenfolge, also erst\n   Geschaeft, dann privat. */\nconst rolesOf = ctx => ctx === 'beide' ? ROLES.slice() : ROLES.filter(r => r.ctx === (ctx || 'b'));\n/* Das Wort, das die Oberflaeche fuer die Rolle benutzt - eine Quelle, damit die\n   Beschriftungen in Modal, Filter, Gruppierung und Statistik nicht auseinanderlaufen. */\nconst roleWord = ctx => ctx === 'p' ? 'Lebensbereich' : ctx === 'beide' ? 'Rolle / Lebensbereich' : 'Rolle';\nconst roleWordPl = ctx => ctx === 'p' ? 'Lebensbereiche' : ctx === 'beide' ? 'Rollen und Lebensbereiche' : 'Rollen';\n/* Rollenliste aus einem Speicher uebernehmen: unbrauchbare Eintraege weg,\n   fehlende Felder auffuellen, und die Gruppierung \"erst b, dann p\"\n   wiederherstellen - die Reihenfolge IST die Sortierung, sie darf von aussen\n   nicht durcheinandergeraten. Eine leere oder unbrauchbare Liste ergibt null,\n   damit ein kaputter Bestand nicht saemtliche Rollen loescht; der Aufrufer\n   behaelt dann die bisherigen. */\nconst normalizeRoles = list => {\n  if (!Array.isArray(list)) return null;\n  const ok = [];\n  const seen = new Set();\n  list.forEach(r => {\n    if (!r || !r.id || seen.has(String(r.id))) return;\n    seen.add(String(r.id));\n    ok.push({ id:String(r.id), label: r.label || String(r.id), color: r.color || MUTED, ctx: r.ctx === 'p' ? 'p' : 'b' });\n  });\n  if (!ok.length) return null;\n  return [...ok.filter(r => r.ctx === 'b'), ...ok.filter(r => r.ctx === 'p')];\n};\n/* Feste Auswahl statt freier Farbwahl: ein <input type=\"color\"> waere billiger\n   im Code, liefert aber Toene, die der Farbregel oben widersprechen (Rot und\n   Gruen gehoeren dem Zustand). Die ersten fuenf sind die bisherigen Rollenfarben. */\nconst ROLE_PALETTE = ['#FF9F0A','#0A84FF','#2FD4B8','#BF5AF2','#8E8E93','#FF6482','#5E5CE6','#64D2FF','#A2845E','#B0C44A'];\n/* Die Abschnitte der Rollenverwaltung. Solange nur einer drinsteht, zeigt die\n   Verwaltung eine schlichte Liste ohne Abschnittsueberschriften und ohne die\n   Listen-Auswahl beim Anlegen. Der private Kontext haengt hier spaeter als\n   zweiter Eintrag { ctx:'p', label:'Lebensbereiche' } an - die Verwaltung\n   selbst muss dafuer nicht angefasst werden. */\nconst ROLE_SECTIONS = [{ ctx:'b', label:'Rollen' }, { ctx:'p', label:'Lebensbereiche' }];\n\n/* \u2500\u2500 Kontext: Business oder Privat (31.07.2026) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n   Aufgabe, Notiz, Projekt und Wochenziel tragen ab jetzt ein Feld `ctx`\n   ('b' = Business, 'p' = Privat). Es wird NIRGENDS von Hand gesetzt: man waehlt\n   eine Rolle bzw. einen Lebensbereich, der Kontext folgt. Zwei Wege, dasselbe\n   zu sagen, waeren einer zu viel.\n\n   Warum ueberhaupt ein Feld, wenn sich der Kontext aus der Rolle ableiten\n   liesse? Wegen des Ausnahmefalls. Ist die Rolle unbekannt - geloescht, aus\n   einem fremden Bestand, ein Tippfehler in tasks.json -, dann wuerde eine rein\n   abgeleitete Loesung ueber den Rueckfall stillschweigend 'b' liefern. Eine\n   private Aufgabe stuende damit im Business-Block der Tagesmail, ohne dass es\n   jemand merkt. Das ist der schlechteste denkbare Fehler dieser Funktion.\n   Zweiter Grund: der Tagesreport liest tasks.json als Aussenstehender und\n   muesste sonst die Rollentabelle mitlesen UND dieselbe Rueckfallregel in einer\n   zweiten Sprache nachbauen. Mit `ctx` am Objekt ist der Vertrag ein Feldzugriff.\n\n   Die Drift zwischen Feld und Rolle erledigt normalizeCtx() auf jedem Lesepfad:\n   ist die Rolle bekannt, ist SIE die Wahrheit; ist sie es nicht, ist das Feld\n   der Ueberlebensanker. */\nconst normalizeCtx = (obj, list) => {\n  const rs = (list && list.length) ? list : ROLES;\n  const r = rs.find(x => x.id === obj.role);\n  if (r) return obj.ctx === r.ctx ? obj : { ...obj, ctx:r.ctx };\n  return obj.ctx ? obj : { ...obj, ctx:'b' };\n};\n/* EINE Migrationsstelle fuer alle vier Objektarten, von jedem Lesepfad benutzt.\n   Wer sie an einem Pfad vergisst, bekommt Objekte, die je nach Startweg im\n   falschen Kontext landen - die unangenehmste Fehlerart, weil sie unregelmaessig\n   auftritt. Deshalb keine Kopien dieser Logik anlegen, sondern diese Funktion\n   aufrufen. `list` erlaubt die Pruefung gegen eine gerade eingelesene\n   Rollenliste; in fromLegacy() ist ROLES noch die alte. */\nconst migrateStock = (d, list) => ({\n  ...d,\n  tasks: (d.tasks || []).map(t => normalizeCtx(t, list)),\n  notes: (d.notes || []).map(n => normalizeCtx(n, list)),\n  weekGoals: (d.weekGoals || []).map(g => normalizeCtx(g, list)),\n  projects: (d.projects || []).map(p => normalizeCtx(p, list))\n});\n\nconst STATUS = [\n  { id:'open',    label:'Offen' },\n  { id:'doing',   label:'In Arbeit' },\n  { id:'waiting', label:'Wartet' },\n  { id:'done',    label:'Erledigt' },\n  { id:'dropped', label:'Verworfen' }\n];\nconst ST_LABEL = Object.fromEntries(STATUS.map(s => [s.id, s.label]));\nconst PRIO = { A:'Sofort', B:'Planen', C:'Abgeben', D:'Sp\u00e4ter' };\n\n/* Wiederholung - freie Form statt starrer Presets-Liste (28.07.2026, auf Albrechts\n   Wunsch neu gebaut, Vorbild Microsoft To-Do \"Benutzerdefiniert\"). Ein Task-Feld\n   `recur` ist jetzt entweder null (keine Wiederholung) oder ein Objekt\n   { n, unit, weekdays } - n: Z\u00e4hler \u22651, unit: 'tag'|'woche'|'monat'|'jahr',\n   weekdays: bei 'woche' optional mehrere Wochentage (sonst gleicher Wochentag wie\n   das F\u00e4llig-Datum). Alte, bis 28.07. genutzte String-Presets ('daily' \u2026 'annual')\n   werden beim Einlesen aus dem GitHub-Sync einmalig migriert, siehe fromLegacy(). */\nconst WEEKDAYS = [\n  { id:'mo', short:'Mo', label:'Montag' },\n  { id:'di', short:'Di', label:'Dienstag' },\n  { id:'mi', short:'Mi', label:'Mittwoch' },\n  { id:'do', short:'Do', label:'Donnerstag' },\n  { id:'fr', short:'Fr', label:'Freitag' },\n  { id:'sa', short:'Sa', label:'Samstag' },\n  { id:'so', short:'So', label:'Sonntag' }\n];\nconst WEEKDAY_MON_IDX = Object.fromEntries(WEEKDAYS.map((w, i) => [w.id, i]));\nconst UNIT_LABEL = { tag:'Tag', woche:'Woche', monat:'Monat', jahr:'Jahr' };\nconst JEDE = { tag:'Jeden', woche:'Jede', monat:'Jeden', jahr:'Jedes' };\nconst UNIT_LABEL_PL = { tag:'Tage', woche:'Wochen', monat:'Monate', jahr:'Jahre' };\n/* Alte Presets (bis 28.07.) -> neues { n, unit, weekdays }-Format. Nur f\u00fcr Migration\n   von bereits synchronisierten Alt-Daten aus tasks.json gebraucht. */\nconst LEGACY_RECUR_MAP = {\n  daily:      { n:1, unit:'tag',   weekdays:[] },\n  weekly:     { n:1, unit:'woche', weekdays:[] },\n  biweekly:   { n:2, unit:'woche', weekdays:[] },\n  monthly:    { n:1, unit:'monat', weekdays:[] },\n  bimonthly:  { n:2, unit:'monat', weekdays:[] },\n  quartal:    { n:3, unit:'monat', weekdays:[] },\n  semiannual: { n:6, unit:'monat', weekdays:[] },\n  annual:     { n:1, unit:'jahr',  weekdays:[] }\n};\nconst addMonths = (d, n) => {\n  const day = d.getDate();\n  const x = new Date(d); x.setDate(1); x.setMonth(x.getMonth() + n);\n  x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate()));\n  return x;\n};\nconst addYears = (d, n) => addMonths(d, n * 12);\n/* Wochentakt mit optionalen Wochentagen: bleibt die aktuelle Woche noch ein\n   ausgew\u00e4hlter Wochentag \u00fcbrig, ist der als n\u00e4chstes dran (Abstand in Tagen). Ist\n   die Woche \"aufgebraucht\", springt es n Wochen weiter zum ersten ausgew\u00e4hlten Tag.\n   So bleibt \"alle 2 Wochen Mo+Mi\" wirklich im 2-Wochen-Takt, statt bei jedem\n   einzelnen Tag zu springen. */\nconst nextWeekly = (d, n, weekdayIds) => {\n  if (!weekdayIds || !weekdayIds.length) return addDays(d, n * 7);\n  const cur = (d.getDay() + 6) % 7; // Montag=0 \u2026 Sonntag=6\n  const idx = weekdayIds.map(id => WEEKDAY_MON_IDX[id]).sort((a, b) => a - b);\n  const laterThisWeek = idx.find(i => i > cur);\n  if (laterThisWeek !== undefined) return addDays(d, laterThisWeek - cur);\n  const startOfWeek = addDays(d, -cur);\n  return addDays(startOfWeek, n * 7 + idx[0]);\n};\nconst nextOccurrence = (dateStr, recur) => {\n  const d = parse(dateStr);\n  const n = Math.max(1, recur.n || 1);\n  if (recur.unit === 'tag')   return addDays(d, n);\n  if (recur.unit === 'monat') return addMonths(d, n);\n  if (recur.unit === 'jahr')  return addYears(d, n);\n  return nextWeekly(d, n, recur.weekdays);\n};\nconst recurLabel = (recur, short) => {\n  if (!recur || !recur.unit) return '';\n  const n = Math.max(1, recur.n || 1);\n  const einheit = n === 1 ? UNIT_LABEL[recur.unit] : UNIT_LABEL_PL[recur.unit];\n  if (recur.unit === 'woche' && (recur.weekdays || []).length) {\n    const tage = WEEKDAYS.filter(w => recur.weekdays.includes(w.id)).map(w => short ? w.short : w.label).join(', ');\n    return (n === 1 ? 'Jede Woche' : `Alle ${n} Wochen`) + ' \u00b7 ' + tage;\n  }\n  /* Der Artikel folgt dem Geschlecht der Einheit: der Tag / der Monat -> \"Jeden\",\n     die Woche -> \"Jede\", das Jahr -> \"Jedes\". Vorher hing er nur an 'tag', daher\n     stand dort \"Jede Monat\" und \"Jede Jahr\". */\n  return n === 1 ? `${JEDE[recur.unit]} ${einheit}` : `Alle ${n} ${einheit}`;\n};\n/* Klon fuer die naechste Runde einer wiederkehrenden Aufgabe - eine einzige Stelle,\n   von toggle() UND closeEffects() genutzt (nicht dupliziert, das hat beim alten\n   RECUR_DAYS-Modell schon mal zum \"quartal\"-Bug gefuehrt). Fael\u00adlig verschiebt sich\n   um nextOccurrence(); Start/Wiedervorlage werden um denselben Millisekunden-Abstand\n   mitverschoben, damit ihr Abstand zum Faellig-Datum erhalten bleibt - das gilt auch\n   bei Monaten/Jahren mit unterschiedlicher Tageszahl. */\nconst recurClone = (t) => {\n  const base = parse(t.due || TODAY);\n  const next = nextOccurrence(t.due || TODAY, t.recur);\n  const deltaMs = next.getTime() - base.getTime();\n  const shift = d => d ? ymd(new Date(parse(d).getTime() + deltaMs)) : '';\n  return { ...t, id: Date.now(), status:'open', archivedAt:'',\n    start: shift(t.start), due: ymd(next), followUp: shift(t.followUp),\n    steps: (t.steps || []).map(x => ({ ...x, done:false })) };\n};\n\nconst AREAS = ['Planen','Projekte','Statistik','Backlog','Archiv'];\nconst VIEWS = { Planen:['Liste','Board','Kalender'], Backlog:['Alle','Aufgaben','Notizen'], Archiv:['Erledigt','Verworfen','Projekte','Notizen'] };\nconst PROJ_VIEWS = ['Ziele','Aufgaben','Gantt'];\nconst SCOPES = [\n  { id:'tag',   label:'Tag',   hint:'ein Tag' },\n  { id:'woche', label:'Woche', hint:'Mo \u2013 So' },\n  { id:'monat', label:'Monat', hint:'ganzer Monat' },\n  { id:'alle',  label:'Alle',  hint:'ohne Zeitfilter' }\n];\nconst GROUPS = ['Termin','Rolle','Projekt','Priorit\u00e4t','Status','Person','Kategorie'];\nconst WD = ['Mo','Di','Mi','Do','Fr','Sa','So'];\n\n/* \u2500\u2500 Datum \u2500\u2500 */\nconst ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;\nconst parse = s => new Date(s + 'T00:00:00');\nconst addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };\nconst mondayOf = d => { const x = new Date(d); const w = (x.getDay()+6)%7; return addDays(x, -w); };\nconst fmtShort = s => s ? parse(s).toLocaleDateString('de-CH',{day:'numeric',month:'short'}) : '';\nconst fmtLong  = d => d.toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long'});\nconst isoWeek = d => { const x = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7)); const y = new Date(Date.UTC(x.getUTCFullYear(),0,1)); return Math.ceil(((x-y)/86400000+1)/7); };\nconst MONTHS = ['Januar','Febru n      onDrop: cz ? cz.onDrop : () => {},\n      onClick: () => this.setState(s => ({ openRow: s.openRow === t.id ? null : t.id })),\n      editClick: (ev) => { ev.stopPropagation(); this.open('task', t); },\n      dotClick: (ev) => this.toggle(t.id, ev),\n      wrapStyle: `box-shadow:inset 0 .5px 0 rgba(255,255,255,${isOpen ? '.09' : '.05'});background:${isOpen ? 'rgba(255,255,255,.028)' : 'transparent'};transition:background .16s`,\n      /* Einf\u00fcgemarke beim Ziehen innerhalb eines Abschnitts: heller Strich an der Oberkante,\n         gleiche Technik wie bei den Board-Karten (cardZone). */\n      rowStyle: `display:flex;align-items:${done ? 'center' : 'flex-start'};gap:12px;padding:${done ? '11px 16px' : '14px 16px'};cursor:pointer;transition:background .14s ease;box-shadow:${cz && cz.active ? 'inset 0 2px 0 var(--drop)' : 'none'}`,\n      hitStyle: `flex:none;width:30px;height:30px;margin:${done ? '-11px' : '-5px'} -11px -11px -11px;display:flex;align-items:center;justify-content:center;cursor:pointer`,\n      dotStyle: `flex:none;width:7px;height:7px;border-radius:50%;${done ? 'background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16)' : `background:${r.color};box-shadow:0 0 0 3.5px ${r.color}1f`}`,\n      titleStyle: `font-size:14.5px;line-height:1.35;letter-spacing:-.011em;font-weight:${t.prio === 'A' && !done ? 560 : 450};color:${done ? 'var(--faint)' : 'var(--ink)'};text-decoration:${done ? 'line-through' : 'none'};text-wrap:pretty`,\n      metaStyle: `display:${meta && !done ? 'block' : 'none'};font-size:12px;letter-spacing:-.004em;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap`,\n      prioStyle: `flex:none;width:13px;text-align:center;font-size:11.5px;font-weight:600;letter-spacing:.02em;padding-top:2px;color:${t.prio === 'A' ? 'var(--ink3)' : 'var(--faint2)'};display:${done ? 'none' : 'block'}`,\n      dueStyle: `flex:none;font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:-.003em;padding-top:1px;color:${over ? RED : 'var(--faint)'};display:${done ? 'none' : 'block'}`,\n      statusChipWrapStyle: `display:${done ? 'none' : 'block'}`,\n      status: this.statusChip(t),\n      caretStyle: `flex:none;font-size:13px;padding-top:1px;color:${isOpen ? 'var(--muted)' : 'var(--dim)'};transition:color .16s`,\n      detailStyle: `display:${isOpen ? 'flex' : 'none'};flex-direction:column;gap:14px;padding:2px 16px 18px 40px`\n    };\n  }\n\n  /* \u2500\u2500 Ziehen und Ablegen \u2500\u2500 */\n  dragStart(id) { return (ev) => { this.setState({ dragId:id }); if (ev.dataTransfer) { ev.dataTransfer.effectAllowed = 'move'; try { ev.dataTransfer.setData('text/plain', String(id)); } catch (e) {} } }; }\n  dragEnd() { this.setState({ dragId:null, dropKey:null, cardKey:null }); }\n  dropZone(key, drop) {\n    const s = this.state;\n    const ok = !!drop && s.dragId != null;\n    return {\n      onDragOver: (ev) => { if (!ok) return; ev.preventDefault(); if (s.dropKey !== key) this.setState({ dropKey:key }); },\n      onDragLeave: (ev) => {\n        // dragleave feuert auch beim Wechsel auf ein Kind \u2013 nur r\u00e4umen, wenn der Zeiger den Kasten wirklich verl\u00e4sst.\n        if (ev.currentTarget.contains(ev.relatedTarget)) return;\n        if (s.dropKey === key) this.setState({ dropKey:null });\n      },\n      onDrop: (ev) => {\n        if (!ok) return;\n        ev.preventDefault();\n        const id = s.dragId;\n        this.setState(x => ({\n          dragId:null, dropKey:null, cardKey:null,\n          /* Sonderfall Kategorie (30.07.2026): wohin sonst gilt \"wohin gezogen,\n             das wird sie\" (ueberschreiben) - Kategorie ist aber ein Mehrfachfeld,\n             also wird ergaenzt statt ersetzt. Albrechts Entscheidung: Ziehen fuegt\n             hinzu, Entfernen einzeln ueber das Aufgaben-Modal (analog Personen). */\n          tasks: x.tasks.map(t => {\n            if (t.id !== id) return t;\n            if (drop && drop.categoryIds) {\n              const cur = t.categoryIds || [];\n              const add = drop.categoryIds.filter(cid => !cur.includes(cid));\n              return add.length ? { ...t, categoryIds: [...cur, ...add] } : t;\n            }\n            return { ...t, ...drop };\n          })\n        }));\n      },\n      active: ok && s.dropKey === key\n    };\n  }\n  /* Ablegen AUF einer Karte: die gezogene Aufgabe wird an genau dieser Stelle eingef\u00fcgt.\n     Danach tragen alle Karten der Spalte eine fortlaufende Nummer (ord), damit die\n     Reihenfolge erhalten bleibt und nicht wieder auf Priorit\u00e4t/Termin zur\u00fcckf\u00e4llt.\n     Kommt die Karte aus einer anderen Spalte, gilt zus\u00e4tzlich deren Zuordnung (colDrop) -\n     wohin die Karte gezogen wird, das wird sie. */\n  cardZone(targetId, colItems, colDrop) {\n    const s = this.state;\n    const ok = s.dragId != null && s.dragId !== targetId;\n    const key = 'card' + targetId;\n    return {\n      onDragOver: (ev) => { if (!ok) return; ev.preventDefault(); if (s.cardKey !== key) this.setState({ cardKey:key }); },\n      onDragLeave: (ev) => { if (ev.currentTarget.contains(ev.relatedTarget)) return; if (s.cardKey === key) this.setState({ cardKey:null }); },\n      onDrop: (ev) => {\n        if (!ok) return;\n        ev.preventDefault(); ev.stopPropagation();\n        const id = s.dragId;\n        const reihe = colItems.map(x => x.id).filter(x => x !== id);\n        const ziel = reihe.indexOf(targetId);\n        reihe.splice(ziel < 0 ? reihe.length : ziel, 0, id);\n        const pos = new Map(reihe.map((x,i) => [x, i]));\n        this.setState(x => ({\n          dragId:null, dropKey:null, cardKey:null,\n          tasks: x.tasks.map(t => {\n            if (!pos.has(t.id)) return t;\n            const zuordnung = (t.id === id && colDrop) ? colDrop : null;\n            return { ...t, ...zuordnung, ord: pos.get(t.id) };\n          })\n        }));\n      },\n      active: ok && s.cardKey === key\n    };\n  }\n  boxStyle(active, base) {\n    return `${base};box-shadow:inset 0 .5px 0 rgba(255,255,255,.07),inset 0 0 0 ${active ? '1px var(--low-mid)' : '.5px rgba(255,255,255,.055)'},0 12px 32px -14px rgba(0,0,0,.8);transition:box-shadow .14s`;\n  }\n\n  /* \u2500\u2500 Klappbare Sektionsk\u00f6pfe (Liste + Board, 05.08.2026) \u2500\u2500\n     Schl\u00fcssel bewusst Bereich+Ansicht+Gruppierung+Titel, NICHT nur Titel:\n     derselbe Titel (\"Meta\") kann in verschiedenen Gruppierungsarten oder\n     Bereichen etwas anderes bedeuten (Rolle vs. Kategorie, Planen vs.\n     Projekte/Aufgaben) - ohne den vollen Schl\u00fcssel w\u00fcrde ein Klapp-Zustand\n     faelschlich auf eine andere Sektion durchschlagen. */\n  sectionKey(area, viewKind, group, title) {\n    return `${area}|${viewKind}|${group}|${title}`;\n  }\n  toggleSection(key) {\n    this.setState(x => {\n      const cur = new Set(x.sectionsClosed || []);\n      cur.has(key) ? cur.delete(key) : cur.add(key);\n      return { sectionsClosed: [...cur] };\n    });\n  }\n\n  /* \u2500\u2500 Gruppierung \u2500\u2500 */\n  sectionsFor(pool) {\n    const g = this.state.group;\n    /* Reihenfolge in einer Spalte: was von Hand geschoben wurde (ord), steht vorn und bleibt,\n       wo es hingeschoben wurde. Alles \u00dcbrige folgt wie bisher nach Priorit\u00e4t und Termin. */\n    const bySort = (a,b) => {\n      const oa = a.ord, ob = b.ord;\n      if (oa != null && ob != null) { if (oa !== ob) return oa - ob; }\n      else if (oa != null) return -1;\n      else if (ob != null) return 1;\n      const p = 'ABCD'.indexOf(a.prio) - 'ABCD'.indexOf(b.prio); if (p) return p;\n      return (a.due || '9999') < (b.due || '9999') ? -1 : 1;\n    };\n    const wrap = (title, items, hint, accent, drop, catId) => ({ title, items, hint, accent, drop, catId });\n    if (g === 'Termin') {\n      const a = parse(this.state.anchor);\n      const mon = mondayOf(a);\n      const todayD = parse(TODAY);\n      const curWeek = mondayOf(todayD).getTime() === mon.getTime();\n      const cand = curWeek\n        ? Array.from({ length:6 }, (_,i) => ymd(addDays(todayD, i+1)))\n        : Array.from({ length:7 }, (_,i) => ymd(addDays(mon, i)));\n      const nextStart = curWeek ? ymd(addDays(todayD, 7)) : ymd(addDays(mon, 7));\n      const nextEnd = curWeek ? ymd(addDays(todayD, 13)) : ymd(addDays(mon, 13));\n      const od = pool.filter(t => this.overdue(t)).sort(bySort);\n      const td = pool.filter(t => t.due === TODAY).sort(bySort);\n      const rest = pool.filter(t => !this.overdue(t) && t.due !== TODAY);\n      const wdDates = cand.filter(ds => { const wd = parse(ds).getDay(); return wd >= 1 && wd <= 5; });\n      const weDates = cand.filter(ds => { const wd = parse(ds).getDay(); return wd === 0 || wd === 6; });\n      const wdBuckets = wdDates.map(ds => wrap(parse(ds).toLocaleDateString('de-CH', { weekday:'long' }), rest.filter(t => t.due === ds).sort(bySort), '', null, { due: ds }));\n      const we = rest.filter(t => weDates.includes(t.due)).sort(bySort);\n      const nw = rest.filter(t => t.due && t.due >= nextStart && t.due <= nextEnd).sort(bySort);\n      const lt = rest.filter(t => t.due && t.due > nextEnd).sort(bySort);\n      const nd = rest.filter(t => !t.due).sort(bySort);\n      const seen = new Set([...od, ...td, ...wdBuckets.flatMap(b => b.items), ...we, ...nw, ...lt, ...nd].map(t => t.id));\n      const past = pool.filter(t => !seen.has(t.id)).sort(bySort);\n      return [\n        wrap('\u00dcberf\u00e4llig', od, 'zuerst abr\u00e4umen', RED, null),\n        wrap('Heute', td, '', null, { due: TODAY }),\n        ...wdBuckets,\n        wrap('Wochenende', we, '', null, { due: weDates[0] || '' }),\n        wrap('N\u00e4chste Woche', nw, '', null, { due: nextStart }),\n        wrap('Sp\u00e4ter', lt, '', null, { due: ymd(addDays(mon, 14)) }),\n        wrap('Vergangen', past, '', null, null),\n        wrap('Ohne Termin', nd, '', null, { due: '' })\n      ].filter(s => s.items.length);\n    }\n    if (g === 'Kategorie') {\n      /* Eigener Zweig statt generisches keyOf/map: eine Aufgabe kann mehrere\n         Kategorien tragen und erscheint dann in JEDER ihrer Sektionen -\n         das ist eine Mehrfachzuordnung, keine Partition, deshalb nicht mit\n         dem generischen Ein-Key-pro-Aufgabe-Mechanismus unten kompatibel\n         (Albrechts Entscheidung 30.07.2026). Sichtbarkeit: Kategorien, die im\n         aktuellen Kontext (Projekt der Aufgabe, oder global) erlaubt sind. */\n      const relevant = CATEGORIES.filter(c => pool.some(t => (t.categoryIds || []).includes(c.id)))\n        .sort((a,b) => (a.ord ?? 999) - (b.ord ?? 999));\n      const withCat = relevant.map(c => wrap(\n        c.name,\n        pool.filter(t => (t.categoryIds || []).includes(c.id)).sort(bySort),\n        '', null,\n        { categoryIds: [c.id] }, /* Drop-Ziel: siehe cardZone/dropZone-Erweiterung unten - fuegt hinzu, ersetzt nicht */\n        c.id /* catId - fuer das Spalten-selbst-Ziehen im Board (30.07.2026) */\n      ));\n      const none = pool.filter(t => !(t.categoryIds || []).length).sort(bySort);\n      return [...withCat, wrap('Ohne Kategorie', none, '', null, null)].filter(s => s.items.length);\n    }\n    if (g === 'Rolle') {\n      /* Eigener Zweig seit 31.07.2026: Sektionsschluessel ist die Rollen-ID,\n         nicht mehr das Label. Mit editierbaren Listen koennen zwei Rollen\n         denselben Namen tragen - spaeter zwangslaeufig, denn \"Meta\" gibt es als\n         Geschaeftsrolle UND als privaten Lebensbereich. Label-basiert waeren\n         beide zu EINER Sektion verschmolzen, und das Ziehen haette ueber\n         ROLES.find(x => x.label === lbl) stumm die erste passende Rolle\n         zugewiesen - also die falsche, und damit spaeter auch den falschen\n         Kontext. Zweite Aenderung: die Reihenfolge ist jetzt die des Arrays\n         (also die in der Verwaltung eingestellte), nicht mehr alphabetisch. */\n      const secs = ROLES\n        .filter(r => pool.some(t => t.role === r.id))\n        .map(r => wrap(r.label, pool.filter(t => t.role === r.id).sort(bySort), '', null, { role:r.id }));\n      const known = new Set(ROLES.map(r => r.id));\n      const orphan = pool.filter(t => !known.has(t.role)).sort(bySort);\n      return [...secs, wrap(NO_ROLE.label, orphan, '', null, null)].filter(s => s.items.length);\n    }\n    const keyOf = {\n      'Projekt':   t => this.projName(t.projectId) || 'Ohne Projekt',\n      'Priorit\u00e4t': t => t.prio,\n      'Status':    t => ST_LABEL[t.status],\n      'Person':    t => (t.people || []).map(id => (PEOPLE.find(p => p.id === id) || {}).name).join(', ') || 'Niemand zugeteilt'\n    }[g];\n    const dropOf = {\n      'Projekt':   lbl => { const p = PROJECTS.find(x => x.name === lbl); return p ? { projectId:p.id } : { projectId:'' }; },\n      'Priorit\u00e4t': lbl => ({ prio: lbl.slice(0, 1) }),\n      'Status':    lbl => { const x = STATUS.find(y => y.label === lbl); return x ? { status:x.id } : null; },\n      'Person':    lbl => { const p = PEOPLE.find(x => x.name === lbl); return p ? { people:[p.id] } : { people:[] }; }\n    }[g];\n    const map = {};\n    pool.forEach(t => { const k = keyOf(t); (map[k] = map[k] || []).push(t); });\n    return Object.keys(map).sort().map(k => wrap(k, map[k].sort(bySort), '', null, dropOf(k)));\n  }\n\n  projStats(pid) {\n    const t = this.state.tasks.filter(x => x.projectId === pid);\n    const done = t.filter(x => x.status === 'done').length;\n    const open = t.filter(x => this.isOpen(x) && !x.backlog).length;\n    const over = t.filter(x => this.overdue(x)).length;\n    return { total:t.length, done, open, over, pct: t.length ? Math.round(done / t.length * 100) : 0 };\n  }\n\n  projectVals(detail, active, all, inRole, view, inCtx) {\n    const s = this.state;\n    const grid = s.area === 'Projekte' && !detail;\n    /* Das Projektraster lief bis 31.07.2026 ohne jeden Filter - dass inRole an\n       diese Funktion uebergeben und nie benutzt wurde, war keine Schlamperei,\n       sondern eine nie gebaute Filterung. Fuer Rollen liess sich das vertreten,\n       fuer Kontexte nicht: private Projekte stuenden sonst im Business-Modus\n       im Raster. Bewusst nur inCtx - die Rollenfilterung der Projekte bleibt\n       aus, das waere eine eigene Entscheidung. */\n    /* KORREKTUR 31.07.2026 (Albrechts Fund): Hier stand zuerst nur inCtx, mit der\n       Begruendung, die Rollenfilterung der Projekte sei \"eine eigene Entscheidung\".\n       Das war falsch gedacht - fuer Albrecht ist der Rollenfilter EIN Bedienelement,\n       das ueberall gleich wirkt, und ein sichtbar gesetzter Filter, der nichts tut,\n       verstoesst gegen die eigene Regel \"Bedienelemente sind nicht sichtbar und tot\".\n       inRole prueft Kontext UND Rolle. */\n    const mk = state => PROJECTS.filter(p => p.state === state).filter(inRole || (() => true)).map(p => {\n      const st = this.projStats(p.id);\n      const r = roleById(p.role);\n      const late = p.end && p.end < TODAY;\n      return {\n        name:p.name, purpose:p.purpose || '\u2014',\n        stats: `${st.open} offen \u00b7 ${st.done} erledigt`,\n        due: p.end ? `F\u00e4llig ${fmtShort(p.end)}` : 'Laufend',\n        onClick: () => this.setState({ project:p.id, projView:'Ziele', openRow:null }),\n        dotStyle: `flex:none;margin-top:5px;width:7px;height:7px;border-radius:50%;background:${r.color};box-shadow:0 0 0 3.5px ${r.color}1f`,\n        barStyle: `height:100%;width:${st.pct}%;border-radius:2px;background:${st.pct === 100 ? GREEN : 'rgba(255,255,255,.4)'}`,\n        dueStyle: `color:${late && st.open ? RED : 'var(--faint)'}`\n      };\n    });\n    const groups = [\n      { title:'Aktiv', items: mk('aktiv') },\n      { title:'Pausiert', items: mk('pausiert') }\n    ].filter(g => g.items.length).map(g => ({ ...g, count:g.items.length }));\n\n    if (!detail) return { showProjectGrid:grid, projGroups:groups, showProjHead:false, showZiele:false, showGantt:false, projKpis:[], projGoals:[], projMs:[], ganttRows:[], ganttCols:[], goalCount:0, msCount:0, newGoal:()=>{}, newMs:()=>{}, noGoalStyle:'display:none', noMsStyle:'display:none', noGanttStyle:'display:none', ganttHeadStyle:'display:none' };\n\n    const st = this.projStats(detail.id);\n    const gs = GOALS.filter(g => g.projectId === detail.id);\n    const ms = MILESTONES.filter(m => m.projectId === detail.id).sort((a,b) => a.date < b.date ? -1 : 1);\n    const tasks = all.filter(t => t.projectId === detail.id);\n\n    /* Gantt: Fenster \u00fcber alle datierten Aufgaben und Meilensteine des Projekts */\n    const gw = this.window();\n    const dated = tasks.filter(t => (t.start || t.due) && this.isOpen(t))\n      .filter(t => !gw || ((t.start || t.due) <= gw.to && (t.due || t.start) >= gw.from));\n    let gantt = [], cols = [];\n    if (dated.length) {\n      const starts = dated.map(t => t.start || t.due).concat(ms.map(m => m.date));\n      const ends = dated.map(t => t.due || t.start).concat(ms.map(m => m.date));\n      const from = gw ? parse(gw.from) : parse(starts.sort()[0]);\n      const to = gw ? parse(gw.to) : parse(ends.sort()[ends.length-1]);\n      const span = Math.max(1, Math.round((to - from) / 86400000) + 1);\n      let cur = new Date(from);\n      while (cur <= to) {\n        const next = new Date(cur.getFullYear(), cur.getMonth()+1, 1);\n        const end = next > to ? addDays(to, 1) : next;\n        const w = Math.round((end - cur) / 86400000) / span * 100;\n        cols.push({ label:`${MONTHS[cur.getMonth()].slice(0,3)} ${String(cur.getFullYear()).slice(2)}`, style:`font-size:11px;letter-spacing:.02em;color:var(--faint2);padding:13px 0;text-align:center;box-shadow:inset .5px 0 0 rgba(255,255,255,.045);width:${w}%;flex:none` });\n        cur = next;\n      }\n      gantt = dated.sort((a,b) => (a.start || a.due) < (b.start || b.due) ? -1 : 1).map(t => {\n        const a = parse(t.start || t.due), b = parse(t.due || t.start);\n        const left = Math.round((a - from) / 86400000) / span * 100;\n        const wid = Math.max(1.5, (Math.round((b - a) / 86400000) + 1) / span * 100);\n        const c = roleById(t.role).color;\n        return {\n          title:t.title, range:`${fmtShort(t.start || t.due)} \u2013 ${fmtShort(t.due || t.start)}`,\n          /* I-08: Klick auf den Titel oeffnet die Aufgabe direkt, statt in den\n             Aufgaben-Reiter zu springen und dort die Zeile aufzuklappen. */\n          onClick: () => this.open('task', t),\n          dotStyle: `flex:none;width:6px;height:6px;border-radius:50%;background:${c}`,\n          titleStyle: 'font-size:13px;letter-spacing:-.008em;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap',\n          barStyle: `position:absolute;top:11px;left:${left}%;width:${wid}%;height:12px;border-radius:6px;background:${this.overdue(t) ? RED : c};opacity:${this.overdue(t) ? 1 : .85};box-shadow:inset 0 .5px 0 rgba(255,255,255,.25)`\n        };\n      });\n    }\n\n    return {\n      showProjectGrid:false, projGroups:[], showProjHead:true,\n      showZiele: view === 'Ziele', showGantt: view === 'Gantt',\n      projKpis: [\n        { label:'Offen', value:st.open, hint:'ohne Backlog', list: tasks.filter(x => this.isOpen(x) && !x.backlog) },\n        { label:'\u00dcberf\u00e4llig', value:st.over, hint:'\u00e4lter als heute', accent: st.over ? RED : null, list: tasks.filter(x => this.overdue(x)) },\n        { label:'Fortschritt', value:`${st.pct}%`, hint:`${st.done} von ${st.total}`, list: tasks.filter(x => x.status === 'done') },\n        { label:'Ziele', value:gs.length, hint:`${ms.length} Meilensteine`, list: [] }\n      ].map(k => ({\n        label:k.label, value:k.value, hint:k.hint,\n        onClick: () => this.setState({ kind:'list', editing:{}, listPayload:{ title:`${k.label} \u00b7 ${detail.name}`, items: k.list || [] } }),\n        valueStyle: `font-size:26px;font-weight:620;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:${k.accent || 'var(--ink)'}`\n      })),\n      goalCount: gs.length, msCount: ms.length,\n      newGoal: () => this.open('goal', { id:null, projectId:detail.id, title:'', note:'' }),\n      newMs: () => this.open('ms', { id:null, projectId:detail.id, title:'', date:ymd(addDays(new Date(),30)), note:'', done:false }),\n      noGoalStyle: `display:${gs.length ? 'none' : 'block'};font-size:13px;color:var(--faint);padding:16px`,\n      noMsStyle: `display:${ms.length ? 'none' : 'block'};font-size:13px;color:var(--faint);padding:16px`,\n      projGoals: gs.map((g, i) => {\n        const items = tasks.filter(t => t.goalId === g.id);\n        const doneN = items.filter(t => t.status === 'done').length;\n        const pct = items.length ? Math.round(doneN / items.length * 100) : 0;\n        const open = s.openRow === 'goal-' + g.id;\n        return {\n          title:g.title, note:g.note, caret: open ? '\u2212' : '+',\n          progress: items.length ? `${doneN}/${items.length}` : 'keine Arbeit',\n          onClick: () => this.setState(x => ({ openRow: x.openRow === 'goal-' + g.id ? null : 'goal-' + g.id })),\n          editClick: (ev) => { ev.stopPropagation(); this.open('goal', g); },\n          wrapStyle: `box-shadow:inset 0 .5px 0 rgba(255,255,255,${i ? '.055' : '0'})`,\n          titleStyle: `font-size:14px;font-weight:${pct === 100 ? 450 : 520};letter-spacing:-.011em;color:${pct === 100 ? 'var(--faint)' : 'var(--ink)'}`,\n          barStyle: `height:100%;width:${pct}%;border-radius:2px;background:${pct === 100 ? GREEN : 'rgba(255,255,255,.4)'}`,\n          caretStyle: `flex:none;font-size:13px;color:${open ? 'var(--muted)' : 'var(--dim)'}`,\n          detailStyle: `display:${open ? 'flex' : 'none'};flex-direction:column;padding:0 16px 14px`,\n          noteStyle: `display:${g.note ? 'block' : 'none'};font-size:12.5px;color:var(--muted2);padding-bottom:8px;text-wrap:pretty`,\n          emptyStyle: `display:${items.length ? 'none' : 'block'};font-size:12.5px;color:var(--faint);padding:6px 0`,\n          items: items me(c => !c.global && c.projectIds.includes(p.id))\n      );\n      listRows = [\n        sectionHeaderRow('global_b', 'Global \u00b7 Business', globalB.length),\n        ...(openSet.has('global_b') ? globalB.map(c => catRow(c, globalB)) : []),\n        sectionHeaderRow('global_p', 'Global \u00b7 Privat', globalP.length),\n        ...(openSet.has('global_p') ? globalP.map(c => catRow(c, globalP)) : []),\n        ...visibleProjects.flatMap(proj => {\n          const cats = CATEGORIES.filter(c => !c.global && c.projectIds.includes(proj.id)).sort(alphaSort);\n          return [\n            sectionHeaderRow('proj_' + proj.id, proj.name, cats.length),\n            ...(openSet.has('proj_' + proj.id) ? cats.map(c => catRow(c, cats)) : [])\n          ];\n        })\n      ];\n      /* Bearbeiten-Unteransicht: Klick auf eine Kategorie-Zeile oeffnet dieselbe\n         Modal-Art erneut mit editCatId - zeigt Name-Feld, Global-Schalter,\n         Projekt-Mehrfachauswahl und Loeschen mit Bestaetigung (verknuepfte\n         Aufgaben werden angezeigt, 30.07.2026 mit Albrecht festgelegt). */\n      if (e.editCatId) {\n        const cat = CATEGORIES.find(c => c.id === e.editCatId) || {};\n        const linked = s.tasks.filter(t => (t.categoryIds || []).includes(e.editCatId));\n        title = 'Kategorie bearbeiten';\n        /* KORREKTUR 30.07.2026 (Albrechts Fund): Global war bisher ein\n           EXKLUSIVER Schalter (seg, entweder/oder) getrennt von der\n           Projekt-Mehrfachauswahl - das erlaubte nie \"global UND Projekt X\"\n           gleichzeitig, obwohl das von Anfang an (29.07., \"Kategorienverwaltung\n           De Luxe\") so vereinbart war. Jetzt: Global ist einfach ein weiterer\n           Eintrag in DERSELBEN Toggle-Liste wie die Projekte - eine Kategorie\n           kann beliebig viele Ziele gleichzeitig tragen. */\n        fields = [field('Name','catName',{ placeholder:'Kategoriename' })];\n        listLabel = 'Sichtbar in';\n        emptyList = '';\n        cons
