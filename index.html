one ? 'var(--faint)' : 'var(--ink)'};text-decoration:${n.done ? 'line-through' : 'none'};text-wrap:pretty`,\n        textStyle: `display:${n.text ? 'block' : 'none'};font-size:12.5px;color:var(--muted2);letter-spacing:-.004em;text-wrap:pretty`,\n        peopleStyle: `display:${(n.people || []).length ? 'block' : 'none'};font-size:12px;color:var(--faint)`\n      }))\n    })).filter(g => g.count);\n\n    const archP = PROJECTS.filter(p => p.state === 'abgeschlossen' && (s.ctx === 'beide' || (p.ctx || 'b') === s.ctx));\n    return {\n      showNotes: wantNotes, showArchProjects: wantProj,\n      noteGroups: groups,\n      noNotesStyle: `display:${wantNotes && !groups.length ? 'block' : 'none'};font-size:13px;color:var(--faint);padding:8px 4px`,\n      archProjects: archP.map((p, i) => {\n        const st = this.projStats(p.id);\n        return {\n          name:p.name, stats:`${st.done} von ${st.total} erledigt`, onClick: () => this.open('project', p),\n          rowStyle: `display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;box-shadow:inset 0 .5px 0 rgba(255,255,255,${i ? '.05' : '0'})`,\n          dotStyle: `flex:none;width:7px;height:7px;border-radius:50%;background:${roleById(p.role).color}`\n        };\n      }),\n      noArchProjStyle: `display:${wantProj && !archP.length ? 'block' : 'none'};font-size:13px;color:var(--faint);padding:18px 16px`\n    };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const detail = s.area === 'Projekte' && s.project ? this.projById(s.project) : null;\n    const isPlan = s.area === 'Planen';\n    const view = detail ? s.projView : s.view;\n    /* Der Kontextfilter. 'beide' laesst alles durch; sonst muss das Objekt in\n       der gewaehlten Welt liegen. Fehlt ctx (Altbestand, der noch nicht durch\n       migrateStock gelaufen ist), gilt Business. */\n    const inCtx = o => s.ctx === 'beide' || (o.ctx || 'b') === s.ctx;\n    /* inRole prueft seit 31.07.2026 BEIDES - Kontext und Rolle. Bewusst in EINEM\n       Praedikat statt an vierzehn Stellen zwei Filter zu verketten: wer spaeter\n       eine Filterstelle ergaenzt, bekommt den Kontext dadurch automatisch mit.\n       Der Name bleibt, damit die Signaturen von projectVals()/statVals()\n       unveraendert bleiben. Gilt fuer Aufgaben UND Notizen - beide tragen\n       role und ctx. */\n    const inRole = o => inCtx(o) && (s.role === 'alle' || o.role === s.role);\n\n    const all = s.tasks;\n    const active = all.filter(t => this.isOpen(t) && !t.backlog);\n    let pool = [];\n    if (isPlan)               pool = active.filter(inRole).filter(t => this.inWindow(t));\n    else if (s.area === 'Backlog') pool = all.filter(t => t.backlog && this.isOpen(t)).filter(inRole);\n    else if (s.area === 'Archiv')  pool = all.filter(t => !this.isOpen(t)).filter(inRole);\n    else if (detail)          pool = active.filter(t => t.projectId === detail.id).filter(inRole).filter(t => this.inWindow(t));\n\n    if (s.area === 'Backlog' && s.view === 'Notizen') pool = [];\n    if (s.area === 'Archiv') {\n      if (s.view === 'Verworfen') pool = pool.filter(t => t.status === 'dropped');\n      else if (s.view === 'Erledigt') pool = pool.filter(t => t.status === 'done');\n      else pool = [];\n    }\n\n    const showList = (isPlan && view === 'Liste')\n      || (s.area === 'Backlog' && s.view !== 'Notizen')\n      || (s.area === 'Archiv' && (s.view === 'Erledigt' || s.view === 'Verworfen'))\n      || (!!detail && view === 'Aufgaben' && s.projTaskMode === 'Liste');\n    const showBoard = (isPlan && view === 'Board') || (!!detail && view === 'Aufgaben' && s.projTaskMode === 'Board');\n    const showCal = (isPlan && view === 'Kalender') || (!!detail && view === 'Aufgaben' && s.projTaskMode === 'Kalender');\n    /* Schl\u00fcsselraum f\u00fcr klappbare Sektionsk\u00f6pfe: \"Planen\" ist global, aber\n       ein Projekt-Aufgaben-Tab braucht die PROJEKT-ID im Schl\u00fcssel, sonst\n       teilen sich alle Projekte denselben Klapp-Zustand pro Sektionstitel\n       (z. B. w\u00fcrde \"Meta\" in Projekt A automatisch auch in Projekt B\n       zuklappen). detail existiert nur bei Projekt-Detail. */\n    const sectionArea = detail ? `Projekt:${detail.id}` : s.area;\n\n    let sections = [];\n    if (s.area === 'Archiv') {\n      const by = {};\n      pool.forEach(t => { const k = (t.archivedAt || '').slice(0, 7) || 'ohne'; (by[k] = by[k] || []).push(t); });\n      sections = Object.keys(by).sort().reverse().map(k => ({\n        title: k === 'ohne' ? 'Ohne Datum' : `${MONTHS[Number(k.slice(5)) - 1]} ${k.slice(0, 4)}`,\n        items: by[k].sort((x, y) => (x.archivedAt || '') < (y.archivedAt || '') ? 1 : -1),\n        hint: '', accent: null\n      }));\n    } else if (showList) {\n      sections = this.sectionsFor(pool);\n    }\n\n    const boardCols = showBoard ? this.sectionsFor(pool) : [];\n\n    /* Kalender */\n    let calCells = [], calHead = [], calCols = 7;\n    if (showCal) {\n      const a = parse(s.anchor);\n      let days = [];\n      if (s.scope === 'alle') { /* Kalender braucht ein Fenster \u2013 ohne Zeitfilter der Monat */ }\n      if (s.scope === 'tag') { days = [a]; calCols = 1; }\n      else if (s.scope === 'woche') { days = Array.from({length:7}, (_,i) => addDays(mondayOf(a), i)); }\n      else {\n        const first = new Date(a.getFullYear(), a.getMonth(), 1);\n        const startD = mondayOf(first);\n        const last = new Date(a.getFullYear(), a.getMonth()+1, 0);\n        const n = Math.ceil(((last - startD) / 86400000 + 1) / 7) * 7;\n        days = Array.from({length:n}, (_,i) => addDays(startD, i));\n      }\n      calHead = calCols === 7 ? WD.map(l => ({ label:l })) : [{ label: fmtLong(a) }];\n      const month = a.getMonth();\n      calCells = days.map(d => {\n        const key = ymd(d);\n        const items = active.filter(inRole).filter(t => !detail || t.projectId === detail.id).filter(t => (t.start || t.due) <= key && (t.due || t.start) >= key && (t.due || t.start));\n        const shown = items.slice(0, s.scope === 'monat' ? 3 : 8);\n        const dim = s.scope === 'monat' && d.getMonth() !== month;\n        const z = this.dropZone('cal' + key, { due: key });\n        return {\n          num: s.scope === 'tag' ? '' : String(d.getDate()),\n          more: items.length > shown.length ? `+${items.length - shown.length}` : '',\n          moreStyle: `display:${items.length > shown.length ? 'block' : 'none'};font-size:11px;color:var(--faint2);padding-left:2px`,\n          onClick: () => this.setState({ scope:'tag', anchor:key }),\n          onDragOver: z.onDragOver, onDragLeave: z.onDragLeave, onDrop: z.onDrop,\n          cellStyle: `min-height:${s.scope === 'monat' ? '92px' : s.scope === 'woche' ? '160px' : '260px'};display:flex;flex-direction:column;gap:5px;padding:8px;cursor:pointer;box-shadow:inset .5px 0 0 rgba(255,255,255,.045),inset 0 .5px 0 rgba(255,255,255,.045)${z.active ? ',inset 0 0 0 1px var(--low-mid)' : ''};background:${key === TODAY ? 'rgba(255,255,255,.035)' : 'transparent'};opacity:${dim ? .4 : 1};transition:background .14s,box-shadow .14s`,\n          numStyle: `font-size:12px;font-weight:${key === TODAY ? 650 : 500};font-variant-numeric:tabular-nums;color:${key === TODAY ? 'var(--ink)' : 'var(--faint)'}`,\n          items: shown.map(t => ({\n            title: t.title,\n            draggable: true, onDragStart: this.dragStart(t.id), onDragEnd: () => this.dragEnd(),\n            onClick: (ev) => { ev.stopPropagation(); this.open('task', t); },\n            chipStyle: `font-size:11.5px;line-height:1.3;letter-spacing:-.005em;padding:3px 6px;border-radius:6px;color:var(--ink2);background:${roleById(t.role).color}26;box-shadow:inset 0 0 0 .5px ${roleById(t.role).color}55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer`\n          }))\n        };\n      });\n    }\n\n    /* Kopf */\n    const openCount = active.filter(inRole).length;\n    const overdueCount = active.filter(inRole).filter(t => this.overdue(t)).length;\n    const titles = { Planen:'Planen', Projekte: detail ? detail.name : 'Projekte', Statistik:'Statistik', Backlog:'Backlog', Archiv:'Archiv' };\n    const summaries = {\n      Planen: `${pool.length} im Zeitraum \u00b7 ${pool.filter(t => this.overdue(t)).length} \u00fcberf\u00e4llig`,\n      Backlog: s.view === 'Notizen'\n        ? `${s.notes.filter(n => !n.done && inRole(n)).length} Notizen`\n        : `${pool.length} zur\u00fcckgestellt${s.view === 'Alle' ? ` \u00b7 ${s.notes.filter(n => !n.done && inRole(n)).length} Notizen` : ''}`,\n      Archiv: s.view === 'Projekte' ? `${PROJECTS.filter(p => p.state === 'abgeschlossen').length} abgeschlossen`\n        : s.view === 'Notizen' ? `${s.notes.filter(n => n.done).length} erledigte Notizen`\n        : `${pool.length} ${s.view === 'Verworfen' ? 'verworfen' : 'erledigt'}`,\n      Statistik: `${openCount} offen \u00b7 ${overdueCount} \u00fcberf\u00e4llig`,\n      /* KORREKTUR 31.07.2026: zaehlte ueber ALLE Projekte, unabhaengig von Kontext\n         und Rollenfilter - im Privat-Modus stand \"3 aktive Projekte\" ueber einem\n         einzigen. Beim Umbau wurden die Zaehler in der Seitenleiste und im\n         Rollenfilter nachgezogen, diese Zeile nicht. */\n      Projekte: detail ? detail.purpose : (n => `${n} ${n === 1 ? 'aktives Projekt' : 'aktive Projekte'}`)(PROJECTS.filter(p => p.state === 'aktiv' && inRole(p)).length)\n    };\n\n    const navStyle = on => `display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;letter-spacing:-.008em;padding:7px 12px;border-radius:8px;cursor:pointer;transition:.14s;color:${on ? 'var(--ink)' : 'var(--muted2)'};font-weight:${on ? 540 : 450};background:${on ? 'rgba(255,255,255,.075)' : 'transparent'};box-shadow:${on ? 'inset 0 .5px 0 rgba(255,255,255,.09)' : 'none'}`;\n    const countStyle = 'font-size:12px;font-variant-numeric:tabular-nums;color:var(--faint2)';\n    /* Mobile Bodenleiste/Rollen-Chips (29.07.2026) - dieselben areas/roleFilters-Eintraege\n       wie die Desktop-Seitenleiste, nur mit anderem Stil fuer die schmale Ansicht. Gleiche\n       Klick-Handler, keine zweite Datenquelle - siehe Mockup-Bestaetigung vom selben Tag. */\n    const tabStyle = on => `flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;cursor:pointer;transition:.14s;color:${on ? 'var(--ink)' : 'var(--faint)'};background:${on ? 'rgba(255,255,255,.06)' : 'transparent'}`;\n    const tabCountStyle = on => `font-size:9.5px;font-variant-numeric:tabular-nums;color:${on ? 'var(--muted2)' : 'var(--dim)'}`;\n    const chipStyle = on => `flex:none;display:flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap;padding:6px 12px 6px 9px;border-radius:20px;cursor:pointer;transition:.14s;color:${on ? 'var(--ink)' : 'var(--muted2)'};font-weight:${on ? 560 : 450};background:${on ? 'rgba(255,255,255,.1)' : 'rgba(255,255,255,.045)'};box-shadow:inset 0 0 0 .5px rgba(255,255,255,.07)`;\n    const chipCountStyle = on => `font-size:12px;font-variant-numeric:tabular-nums;color:${on ? 'var(--muted)' : 'var(--faint2)'}`;\n    const segStyle = on => `font-size:12.5px;letter-spacing:-.005em;padding:6px 11px;border-radius:7px;cursor:pointer;transition:.14s;color:${on ? 'var(--ink)' : 'var(--muted2)'};font-weight:${on ? 550 : 450};background:${on ? 'rgba(255,255,255,.09)' : 'transparent'};box-shadow:${on ? 'inset 0 .5px 0 rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.35)' : 'none'}`;\n    const menuStyle = open => `display:${open ? 'flex' : 'none'};position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:170px;flex-direction:column;padding:5px;border-radius:11px;background:var(--surface2);box-shadow:inset 0 .5px 0 rgba(255,255,255,.09),inset 0 0 0 .5px rgba(255,255,255,.07),0 18px 40px -12px rgba(0,0,0,.85)`;\n    const itemStyle = on => `display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;letter-spacing:-.008em;padding:7px 10px;border-radius:7px;cursor:pointer;transition:.14s;color:${on ? 'var(--ink)' : 'var(--muted2)'};background:${on ? 'rgba(255,255,255,.07)' : 'transparent'}`;\n\n    const scopeObj = SCOPES.find(x => x.id === s.scope) || SCOPES[1];\n    const a = parse(s.anchor);\n    const periodLabel = s.scope === 'tag' ? fmtLong(a)\n      : s.scope === 'woche' ? `KW ${isoWeek(a)} \u00b7 ${fmtShort(ymd(a))} \u2013 ${fmtShort(ymd(addDays(a,6)))}`\n      : s.scope === 'monat' ? `${MONTHS[a.getMonth()]} ${a.getFullYear()}` : 'Alle Termine';\n\n    const viewList = detail ? PROJ_VIEWS : (VIEWS[s.area] || []);\n    const curView = detail ? s.projView : s.view;\n    const showControls = viewList.length > 1;\n    const timeView = isPlan || (detail && (view === 'Aufgaben' || view === 'Gantt'));\n    const groupView = (isPlan && view !== 'Kalender') || (detail && view === 'Aufgaben' && s.projTaskMode !== 'Kalender');\n\n    /* Wochenziele liefen bis 31.07.2026 voellig ungefiltert - der Rollenfilter\n       griff hier nie. Fuer Rollen war das verschmerzbar, fuer Kontexte nicht:\n       private Wochenziele stuenden sonst im Business-Modus ganz oben auf der\n       Seite. Bewusst nur inCtx, nicht inRole - am Rollenverhalten der\n       Wochenziele wird nichts geaendert. */\n    const wgs = s.weekGoals.filter(g => g.week === ymd(mondayOf(a))).filter(inCtx);\n\n    return {\n      headDate: new Date().toLocaleDateString('de-CH', { weekday:'long', day:'numeric', month:'long' }),\n      peopleCount: PEOPLE.length,\n      categoryCount: CATEGORIES.length,\n      roleCount: ROLES.length,\n      syncMsg: this.state.syncMsg,\n      syncDotStyle: (() => {\n        const c = { ok:GREEN, err:RED, busy:'var(--muted2)', warn:'var(--muted2)', off:'var(--dim2)' }[this.state.syncState] || 'var(--dim2)';\n        return `width:6px;height:6px;border-radius:50%;background:${c};box-shadow:0 0 0 3px ${c}24`;\n      })(),\n\n      areas: AREAS.map(label => ({\n        label,\n        count: label === 'Planen' ? active.filter(inRole).length\n             : label === 'Backlog' ? all.filter(t => t.backlog && this.isOpen(t)).filter(inRole).length\n             : '',\n        onClick: () => this.go(label),\n        style: navStyle(label === s.area), countStyle,\n        tabStyle: tabStyle(label === s.area), tabCountStyle: tabCountStyle(label === s.area)\n      })),\n      /* Der Umschalter. EINE Quelle fuer beide Orte - Seitenleiste und mobile\n         Chrome lesen dieselben Eintraege, wie es die Bereiche und die Rollen-Chips\n         seit dem 29.07. schon vormachen. Beim Wechsel wird der Rollenfilter\n         zurueckgesetzt (ein DM-Filter ergibt privat keinen Sinn) und ein offenes\n         Projekt geschlossen - sonst bliebe man in einem Projekt stehen, das es im\n         neuen Kontext gar nicht gibt. */\n      ctxOptions: [{ id:'b', label:'Business' }, { id:'p', label:'Privat' }, { id:'beide', label:'Beide' }].map(c => ({\n        label: c.label,\n        onClick: () => this.setState({ ctx:c.id, role:'alle', project:null, openRow:null }),\n        style: `flex:1;text-align:center;font-size:12px;padding:7px 4px;border-radius:8px;cursor:pointer;transition:.14s;letter-spacing:-.004em;white-space:nowrap;`\n             + (c.id === s.ctx\n                ? 'color:var(--ink);font-weight:560;background:rgba(255,255,255,.1);box-shadow:0 1px 2px rgba(0,0,0,.35)'\n                : 'color:var(--muted2)')\n      })),\n      roleFilterTitle: s.ctx === 'beide' ? 'Filter' : `Filter \u00b7 ${roleWord(s.ctx)}`,\n\n      /* Im Modus \"Beide\" bekommt die Filterliste Zwischenueberschriften, damit\n         Rollen und Lebensbereiche nicht als eine Liste gelesen werden - genau das\n         Muster, das die Kategorienverwaltung mit sectionHeaderRow schon nutzt.\n         Kein Umbau der Vorlage noetig: eine Ueberschrift ist eine Zeile ohne Punkt,\n         ohne Zaehler und ohne Klick-Wirkung. Mobil bleiben sie unsichtbar - in\n         einer waagrecht scrollenden Chip-Zeile waere eine Ueberschrift Unsinn. */\n      roleFilters: (() => {\n        const kopf = t => ({\n          label: t, count: '', onClick: () => {},\n          style: 'font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:9px 12px 3px;display:flex;align-items:center;gap:9px',\n          countStyle: 'display:none', dotStyle: 'display:none',\n          chipStyle: 'display:none', chipCountStyle: 'display:none'\n        });\n        const eintrag = r => ({\n          label: r.label,\n          /* inCtx gehoert hier dazu: ohne ihn zaehlte \"Alle\" im Privat-Modus die\n             Geschaeftsaufgaben mit (gefunden am Bild, 31.07.2026 - die Liste zeigte\n             null Aufgaben, der Zaehler 14). Die einzelnen Rollen waren nie betroffen,\n             weil eine Rollen-ID ohnehin nur in einer Welt vorkommt. */\n          count: active.filter(t => inCtx(t) && (r.id === 'alle' || t.role === r.id)).length,\n          onClick: () => this.setState({ role:r.id }),\n          style: navStyle(r.id === s.role), countStyle,\n          dotStyle: `width:7px;height:7px;border-radius:50%;background:${r.color};box-shadow:0 0 0 3px ${r.color}1f`,\n          chipStyle: chipStyle(r.id === s.role), chipCountStyle: chipCountStyle(r.id === s.role)\n        });\n        const alle = eintrag({ id:'alle', label:'Alle', color:'var(--faint)' });\n        if (s.ctx !== 'beide') return [alle, ...rolesOf(s.ctx).map(eintrag)];\n        return [alle, ...ROLE_SECTIONS.flatMap(sec => {\n          const rs = ROLES.filter(r => r.ctx === sec.ctx);\n          return rs.length ? [kopf(sec.label), ...rs.map(eintrag)] : [];\n        })];\n      })(),\n\n      viewTitle: titles[s.area],\n      summary: summaries[s.area] || '',\n      /* I-05: \"\u2190 Projekte\" ist entfallen - der Weg zurueck laeuft ohnehin ueber die\n         Seitenleiste bzw. die mobile Bodenleiste. Damit bleibt nur \"Projekt\n         bearbeiten\" in der Zeile; flex-end haelt es rechts, wo es vorher stand\n         (space-between haette es nach links rutschen lassen). */\n      backRowStyle: `display:${detail ? 'flex' : 'none'};align-items:baseline;justify-content:flex-end;gap:16px`,\n      backToProjects: () => this.setState({ project:null }),\n      editProject: () => detail && this.open('project', detail),\n      chips: s.role === 'alle' ? [] : [{\n        label: roleById(s.role).label,\n        onClear: () => this.setState({ role:'alle' }),\n        dotStyle: `width:6px;height:6px;border-radius:50%;background:${roleById(s.role).color}`\n      }],\n      primaryLabel: { project:'Neues Projekt', goal:'Neues Ziel', note:'Neue Notiz', task:'Neue Aufgabe' }[this.primaryKind(detail)],\n      primaryStyle: `flex:none;margin-top:3px;display:${s.area === 'Archiv' || s.area === 'Statistik' ? 'none' : 'flex'};align-items:center;gap:6px;font-size:13px;font-weight:530;letter-spacing:-.005em;color:var(--accent-fg);background:linear-gradient(var(--accent1),var(--accent2));border-radius:9px;padding:8px 14px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.35)`,\n      primaryAction: () => this.primary(detail),\n\n      controlBarStyle: `display:${showControls ? 'flex' : 'none'};align-items:center;justify-content:flex-start;gap:16px 20px;flex-wrap:wrap`,\n      timeNavStyle: `display:${timeView && s.scope !== 'alle' ? 'flex' : 'none'};align-items:center;gap:2px;padding:2px;border-radius:9px;background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 0 0 .5px rgba(255,255,255,.07)`,\n      periodLabel,\n      prevPeriod: () => this.shift(-1),\n      nextPeriod: () => this.shift(1),\n      resetPeriod: () => this.setState({ anchor: ymd(mondayOf(new Date())) }),\n\n      scopeWrapStyle: `display:${timeView ? 'block' : 'none'};position:relative`,\n      scopeLabel: scopeObj.label,\n      toggleScope: () => this.setState(x => ({ scopeOpen: !x.scopeOpen, groupOpen:false })),\n      closeMenus: () => this.setState({ scopeOpen:false, groupOpen:false }),\n      scopeBackdropStyle: `display:${s.scopeOpen ? 'block' : 'none'};position:fixed;inset:0;z-index:39`,\n      scopeMenuStyle: menuStyle(s.scopeOpen && timeView),\n      scopeOpts: SCOPES.map(o => ({\n        label:o.label, hint:o.hint, style: itemStyle(o.id === s.scope),\n        onClick: () => this.setState({ scope:o.id, scopeOpen:false })\n      })),\n\n      viewBarStyle: `display:${showControls ? 'flex' : 'none'};padding:2px;border-radius:9px;background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 0 0 .5px rgba(255,255,255,.07)`,\n      views: viewList.map(v => ({\n        label:v, style: segStyle(v === curView),\n        onClick: () => this.setState(detail\n          ? { projView:v, openRow:null, ...(v === 'Gantt' && s.scope !== 'monat' ? { scope:'monat' } : {}) }\n          : { view:v, openRow:null })\n      })),\n\n      projModeWrapStyle: `display:${(!!detail && view === 'Aufgaben') ? 'flex' : 'none'};padding:2px;border-radius:9px;background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 0 0 .5px rgba(255,255,255,.07)`,\n      projModes: ['Liste','Board','Kalender'].map(v => ({\n        label:v, style: segStyle(v === s.projTaskMode),\n        onClick: () => this.setState({ projTaskMode:v })\n      })),\n\n      groupWrapStyle: `display:${groupView ? 'flex' : 'none'};align-items:center;gap:10px`,\n      groupLabel: s.group === 'Rolle' && s.ctx !== 'beide' ? roleWord(s.ctx) : s.group,\n      toggleGroup: () => this.setState(x => ({ groupOpen: !x.groupOpen, scopeOpen:false })),\n      groupBackdropStyle: `display:${s.groupOpen ? 'block' : 'none'};position:fixed;inset:0;z-index:39`,\n      groupMenuStyle: menuStyle(s.groupOpen && groupView),\n      groupOpts: GROUPS.map(g => ({ label: g === 'Rolle' && s.ctx !== 'beide' ? roleWord(s.ctx) : g, style: itemStyle(g === s.group), onClick: () => this.setState({ group:g, groupOpen:false }) })),\n\n      showFocus: s.area === 'Planen',\n      focusRange: `KW ${isoWeek(a)} \u00b7 ${fmtShort(ymd(mondayOf(a)))} \u2013 ${fmtShort(ymd(addDays(mondayOf(a), 6)))}`,\n      newWeekGoal: () => { const c = s.ctx === 'beide' ? 'b' : s.ctx;\n        this.open('wg', { id:null, title:'', role: (rolesOf(c)[0] || NO_ROLE).id, ctx:c, note:'', week: ymd(mondayOf(a)) }); },\n      noGoalsStyle: `display:${wgs.length ? 'none' : 'block'};font-size:13px;color:var(--faint);padding:4px`,\n      weekGoals: wgs.map(g => {\n        const items = active.filter(t => t.wgId === g.id);\n        const allT = all.filter(t => t.wgId === g.id);\n        const doneN = allT.filter(t => t.status === 'done').length;\n        const pct = allT.length ? Math.round(doneN / allT.length * 100) : 0;\n        const r = roleById(g.role);\n        const reached = g.reached === true || (allT.length > 0 && pct === 100);\n        return {\n          title: g.title, onClick: () => this.open('wg', g),\n          progress: reached && !allT.length ? 'Erreicht' : allT.length ? `${doneN} von ${allT.length} erledigt \u00b7 ${pct}%` : 'Noch keine Arbeit zugeordnet',\n          titleStyle: `font-size:14px;font-weight:540;letter-spacing:-.012em;line-height:1.35;text-wrap:pretty;color:${reached ? 'var(--muted2)' : 'var(--ink)'}`,\n          dotStyle: `flex:none;margin-top:5px;width:7px;height:7px;border-radius:50%;background:${r.color};box-shadow:0 0 0 3.5px ${r.color}1f`,\n          barStyle: `height:100%;width:${reached ? 100 : pct}%;border-radius:2px;background:${reached ? GREEN : 'rgba(255,255,255,.4)'}`\n        };\n      }),\n\n      showList,\n      sections: sections.map((sec, si) => {\n        const z = this.dropZone('sec' + si, sec.drop);\n        const key = this.sectionKey(sectionArea, 'Liste', s.group, sec.title);\n        const closed = (s.sectionsClosed || []).includes(key);\n        return {\n        title: sec.title, count: sec.items.length, hint: sec.hint,\n        onDragOver: z.onDragOver, onDragLeave: z.onDragLeave, onDrop: z.onDrop,\n        boxStyle: `${this.boxStyle(z.active, 'border-radius:14px;background:linear-gradient(var(--card-a1),var(--card-a2));overflow:hidden')};display:${closed ? 'none' : 'block'}`,\n        titleStyle: `font-size:12.5px;font-weight:590;letter-spacing:-.005em;color:${sec.accent || 'var(--muted)'}`,\n        hintStyle: `font-size:12px;color:var(--faint2);display:${sec.hint ? 'block' : 'none'}`,\n        headStyle: 'display:flex;align-items:baseline;gap:9px;padding:0 4px;cursor:pointer;user-select:none',\n        onHeadClick: () => this.toggleSection(key),\n        caretStyle: `flex:none;font-size:13px;color:var(--faint2);transition:transform .14s;transform:rotate(${closed ? '-90deg' : '0deg'});margin-left:auto`,\n        items: sec.items.map(t => this.row(t, this.cardZone(t.id, sec.items, sec.drop)))\n      }; }),\n      emptyStyle: `display:${showList && !sections.length ? 'block' : 'none'};font-size:13px;color:var(--faint);padding:8px 4px`,\n      emptyText: s.area === 'Backlog' ? 'Nichts zur\u00fcckgestellt.' : s.area === 'Archiv' ? 'Noch nichts abgelegt.' : 'Nichts in diesem Zeitraum.',\n\n      showBoard,\n      boardGridStyle: `display:grid;grid-template-columns:repeat(${Math.max(1, Math.min(boardCols.length, 4))},minmax(0,1fr));gap:12px;align-items:start`,\n      /* Ein Punkt je Board-Spalte, nur fuer die mobile Wischansicht. Bei einer einzigen\n         Spalte leer - .pep-pager:empty blendet den Behaelter dann komplett aus. */\n      pagerDots: boardCols.length > 1 ? boardCols.map(() => ({})) : [],\n      board: boardCols.map((col, ci) => { const z = this.dropZone('col' + ci, col.drop);\n        const key = this.sectionKey(sectionArea, 'Board', s.group, col.title);\n        const closed = (s.sectionsClosed || []).includes(key);\n        return {\n        title: col.title, count: col.items.length,\n        closed,\n        /* Ganzer Kopf klickbar zum Klappen (05.08.2026, Albrechts Feedback:\n           Chevron allein zu klein/unpraktisch als alleiniges Ziel - Angleichung\n           an die Liste, wo der ganze Kopf schon klickbar war). headDraggable\n           bleibt bei Kategorie-Gruppierung bestehen (Spalten-Sortierung) -\n           Kategorien sind aktuell nicht produktiv nutzbar (keine Aufgabe\n           zuordenbar), daher bewusst kein Sonderfall daf\u00fcr; bei Wiederaufnahme\n           der Kategorien-Arbeit hier erneut pr\u00fcfen. */\n        onHeadClick: () => this.toggleSection(key),\n        headStyle: 'display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 14px 11px;cursor:pointer;user-select:none',\n        caretStyle: `flex:none;font-size:13px;color:var(--faint2);transition:transform .14s;transform:rotate(${closed ? '-90deg' : '0deg'})`,\n        bodyStyle: `display:${closed ? 'none' : 'flex'};flex-direction:column;gap:8px;padding:0 10px 12px`,\n        onDragOver: z.onDragOver, onDragLeave: z.onDragLeave, onDrop: (ev) => {\n          /* Spalte-als-Ganzes-Ziehen (30.07.2026, Albrechts Vereinbarung aus\n             diesem Chat: \"echtes Ziehen wie im Board\", bezogen auf die\n             Kategorie-Sortierung generell, nicht nur die Verwaltungsliste).\n             Nur bei Kategorie-Gruppierung wirksam (col.catId gesetzt) UND nur\n             wenn eine SPALTE gezogen wird (catDragId), nicht eine Karte\n             (dragId) - beide Ziehvorgaenge duerfen nicht kollidieren. */\n          if (this.state.catDragId != null && col.catId) {\n            ev.preventDefault(); ev.stopPropagation();\n            const dragId = this.state.catDragId;\n            if (dragId === col.catId) return;\n            const siblings = boardCols.filter(c => c.catId).map(c => c.catId);\n            if (!siblings.includes(dragId)) return;\n            const reihe = siblings.filter(id => id !== dragId);\n            const ziel = reihe.indexOf(col.catId);\n            reihe.splice(ziel < 0 ? reihe.length : ziel, 0, dragId);\n            CATEGORIES = CATEGORIES.map(cat => {\n              const pos = reihe.indexOf(cat.id);\n              return pos < 0 ? cat : { ...cat, ord: pos };\n            });\n            this.setState({ catDragId: null });\n            return;\n          }\n          z.onDrop(ev);\n        },\n        /* Spalten-Kopf selbst ziehbar, aber NUR bei Kategorie-Gruppierung -\n           bei allen anderen Gruppierungen (Status, Rolle, ...) bleibt die\n           Spaltenreihenfolge an feste Konstanten gekoppelt, das ist ein\n           anderer, hier nicht angefasster Mechanismus. */\n        headDraggable: !!col.catId,\n        onHeadDragStart: col.catId ? () => this.setState({ catDragId: col.catId }) : () => {},\n        onHeadDragEnd: () => this.setState({ catDragId: null }),\n        boxStyle: this.boxStyle(z.active, 'border-radius:14px;background:linear-gradient(var(--card-b1),var(--card-b2));overflow:hidden'),\n        titleStyle: `font-size:11.5px;font-weight:590;letter-spacing:.05em;text-transform:uppercase;color:${col.accent || 'var(--muted2)'};cursor:${col.catId ? 'grab' : 'default'}`,\n        emptyStyle: `display:${col.items.length ? 'none' : 'block'};font-size:12px;color:var(--dim);padding:6px 2px`,\n        items: col.items.map(t => { const cz = this.cardZone(t.id, col.items, col.drop); return {\n          title: t.title, due: t.due ? fmtShort(t.due) : '',\n          meta: this.projName(t.projectId) || PRIO[t.prio],\n          onClick: () => this.open('task', t),\n          onDragOver: cz.onDragOver, onDragLeave: cz.onDragLeave, onDrop: cz.onDrop,\n          /* Einf\u00fcgemarke: ein heller Strich an der Oberkante der Karte, vor der eingef\u00fcgt wird.\n             Kein zus\u00e4tzliches Element - dieselbe inset-Schattentechnik wie \u00fcberall sonst. */\n          cardStyle: `display:flex;flex-direction:column;gap:8px;padding:11px 12px;border-radius:11px;background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.06)${cz.active ? ',inset 0 2.5px 0 var(--drop)' : ''};cursor:pointer;transition:box-shadow .12s`,\n          dotStyle: `flex:none;margin-top:5px;width:6px;height:6px;border-radius:50%;background:${roleById(t.role).color}`,\n          titleStyle: 'flex:1;min-width:0;font-size:12.5px;line-height:1.35;letter-spacing:-.008em;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden',\n          metaStyle: 'font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap',\n          dueStyle: `flex:none;font-size:11px;font-variant-numeric:tabular-nums;color:${this.overdue(t) ? RED : 'var(--faint)'}`,\n          statusChipWrapStyle: 'flex:none',\n          status: this.statusChip(t),\n          draggable: true, onDragStart: this.dragStart(t.id), onDragEnd: () => this.dragEnd()\n        }; })\n      }; }),\n\n      showCal,\n      calHeadStyle: `display:grid;grid-template-columns:repeat(${calCols},minmax(0,1fr))`,\n      calGridStyle: `display:grid;grid-template-columns:repeat(${calCols},minmax(0,1fr))`,\n      calHead, calCells,\n\n      ...this.projectVals(detail, active, all, inRole, view, inCtx),\n      ...this.statVals(all, active, inRole),\n      ...this.noteVals(),\n\n      ...this.modalVals(),\n      ...this.taskModalVals(),\n      ...this.statusMenuVals(),\n      ...this.recurPanelVals(),\n      openSearch: () => this.setState({ searchOpen:true, query:'' }),\n      openPeople: () => this.open('people', {}),\n      openCategories: () => this.open('categories', { draftTargets:[] }),\n      openRoles: () => this.open('roles', { draft:'', draftCtx:'b' }),\n      openData: () => this.open('data', { repo:(this.state.gh || {}).repo || 'AlbrechtBuehler/task-dashboard-data', token:(this.state.gh || {}).token || '' })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
